<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="description" content="Controle financeiro pessoal: despesas, receitas, checklist de contas e metas.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="tc" content="#070B0E">
<script>
(function(){var p='escuro';try{p=localStorage.getItem('financas-tema')||'escuro'}catch(e){}
var t=p==='claro'?'light':p==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B0E;--surface:#0E161B;--surface-2:#121D23;--ink:#E9F2F3;--muted:#8D9EA6;--line:#1C2830;--soft:#15212A;
  --accent:#3DE0B0;--accent-ink:#032A1F;--accent-2:#46B5FF;
  --pos:#3DDC97;--pos-ink:#03281B;--neg:#FF6B6B;--save:#8AA8FF;--warn:#FFC24B;
  --bar-pos:#36A06F;--bar-neg:#D66049;--bar-mag:#2FB58D;
  --glow:rgba(61,224,176,.16);--glow-2:rgba(70,181,255,.12);--sombra:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F2F5F7;--surface:#FFFFFF;--surface-2:#F7F9FA;--ink:#0B1A20;--muted:#56666D;--line:#DAE2E6;--soft:#E8EEF1;
  --accent:#0B8A64;--accent-ink:#FFFFFF;--accent-2:#1F7FD1;
  --pos:#12825A;--pos-ink:#FFFFFF;--neg:#C8443C;--save:#3B5BA5;--warn:#9E6D06;
  --bar-pos:#1E7A54;--bar-neg:#B5432E;--bar-mag:#1E8C6B;
  --glow:rgba(11,138,100,.10);--glow-2:rgba(31,127,209,.08);--sombra:0 8px 24px rgba(16,40,50,.10);
  color-scheme:light;
}
/* faixa da barra de status do iPhone sempre escura no tema claro (o texto dela é branco) */
@media (display-mode: standalone){:root[data-theme="light"] body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#070B0E;z-index:40}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* estrutura */
.app{min-height:100vh}
.side{display:none}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:10px;min-height:60px}
.mes{display:flex;align-items:center;gap:2px;margin-right:auto}
.mes-l{font-weight:700;font-size:1.05rem;min-width:132px;text-align:center;letter-spacing:-.01em}
.ic-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ic-btn:hover{background:var(--soft)}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .navb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 1px 4px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs .navb[aria-current="page"]{color:var(--ink)}
.tabs .navb[aria-current="page"]::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(10,30,28,.25)}
.fab svg{width:28px;height:28px}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:26px 16px 20px;border-right:1px solid var(--line)}
  .brand{font-weight:800;font-size:1.35rem;letter-spacing:-.03em;padding:0 10px 14px}
  .side .btn{margin:0 4px 14px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:12px 14px}
  .side .navb,.side-link{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;width:100%}
  .side .navb:hover,.side-link:hover{background:var(--soft);color:var(--ink)}
  .side .navb[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  .side-pe{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .sync{font-size:.8rem;color:var(--muted);padding:0 12px}
  .tabs,.fab,.m-only{display:none!important}
  main{padding-bottom:56px}
  .top-in{min-height:72px}
}

/* tipografia de seções */
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px}
.vh h1{font-size:1.65rem;font-weight:800;letter-spacing:-.025em}
.bloco{margin-top:28px}
.bloco-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.bloco-h h2{font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
.dica{color:var(--muted);font-size:.88rem}
.dica.topo{margin-top:20px}
.nada{color:var(--muted);margin-bottom:12px}
.aviso{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:6px 0 4px}
.carregando{color:var(--muted);padding:40px 0}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* hero */
.hero{padding:8px 0 4px}
.hero-l{color:var(--muted);font-size:.95rem}
.hero-v{margin:2px 0 2px;font-size:clamp(2.6rem,11vw,3.7rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-v.neg{color:var(--neg)}
.hero-e{color:var(--muted);font-size:.95rem;margin-bottom:16px}
.regua{position:relative;display:flex;gap:3px;height:22px;border-radius:7px;background:var(--soft);overflow:hidden}
.regua span{height:100%}
.s-desp{background:var(--neg)}.s-apo{background:var(--save)}.s-sobra{background:var(--pos)}
.regua .marca{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.fluxo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.fluxo div{min-width:0}
.fluxo dt{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.fluxo dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{width:10px;height:10px;border-radius:3px;flex:none}
.k-desp{background:var(--neg)}.k-apo{background:var(--save)}.k-sobra{background:var(--pos)}

/* painéis e listas */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.vazio{padding:22px 20px}
.vazio h2{font-size:1.1rem;margin-bottom:6px}
.vazio p{color:var(--muted);margin-bottom:14px}
.vazio p:last-child{margin-bottom:0}
.lista{list-style:none;margin:0;padding:0}
.lista>li+li{border-top:1px solid var(--line)}
.linha{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 4px}
.linha-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px 8px;text-align:left;cursor:pointer;border-radius:10px}
.linha-main.estatico{cursor:default}
button.linha-main:hover{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.txt{display:flex;flex-direction:column;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:.84rem;color:var(--muted)}
.val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-weight:500;color:var(--muted);font-size:.84rem}
.val.v-receita{color:var(--pos)}.val.v-aporte{color:var(--save)}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer}
.tx:hover{background:var(--soft)}
.lista>li:first-child .tx{border-radius:var(--radius) var(--radius) 0 0}
.lista>li:last-child .tx{border-radius:0 0 var(--radius) var(--radius)}
.lista>li:only-child .tx{border-radius:var(--radius)}
.tx .txt{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.pill:hover{border-color:var(--ink)}
.pill.pago{background:var(--soft);color:var(--pos);border-color:transparent;padding:7px 9px}
.pill svg{width:16px;height:16px}
.st{font-style:normal;font-weight:700;margin-left:2px}
.st-atrasada{color:var(--neg)}.st-hoje,.st-breve{color:var(--warn)}
.mais{color:var(--muted);font-size:.88rem;margin-top:8px}
h3.dia{font-size:.86rem;color:var(--muted);font-weight:600;margin:20px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 15px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* barras e orçamento */
.barra{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.barra>span{display:block;height:100%;background:var(--pos);border-radius:4px}
.barra.alerta>span{background:var(--accent)}
.barra.estouro>span{background:var(--neg)}
.barra.b-meta>span{background:var(--save)}
.orc-btn{display:block;width:100%;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.orc-btn:hover{background:var(--soft)}
.lista>li:first-child .orc-btn{border-radius:var(--radius) var(--radius) 0 0}
.lista>li:last-child .orc-btn{border-radius:0 0 var(--radius) var(--radius)}
.lista>li:only-child .orc-btn{border-radius:var(--radius)}
.orc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.nome{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orc-bot{display:flex;justify-content:space-between;margin-top:6px;font-size:.84rem;color:var(--muted)}
.orc-tot{padding:4px 0 6px}
.orc-v{font-size:1.15rem;margin:4px 0 12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.orc-v strong{font-size:2rem;color:var(--ink);font-weight:800;letter-spacing:-.03em}
.orc-tot .barra{height:12px;border-radius:6px}
.orc-msg{margin-top:10px;font-weight:600}
.placar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.placar div{display:flex;flex-direction:column}
.placar span{font-size:.86rem;color:var(--muted)}
.placar strong{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* metas */
.metas{display:flex;flex-direction:column;gap:14px}
.meta{padding:16px 16px 18px}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta-top h2{font-size:1.1rem}
.meta-v{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.meta-v small{font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0}
.meta-txt{color:var(--muted);font-size:.9rem;margin-top:10px}
.meta-acoes{display:flex;gap:10px;margin-top:14px}
.meta-acoes>*{flex:1}

/* botões */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.05)}
.btn-sec{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-sec:hover{border-color:var(--ink)}
.btn-sec svg,.btn svg{width:18px;height:18px}
.btn-perigo{background:transparent;color:var(--neg);border:0;padding:12px 6px;font-weight:700;cursor:pointer;margin-right:auto}
.btn-perigo-cheio{background:var(--neg);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;cursor:pointer;padding:4px 0;font-weight:600}
.link-mes{font-size:.86rem;white-space:nowrap}

/* modais */
#modal-root,#confirm-root{position:fixed;inset:0;z-index:50}
#confirm-root{z-index:60}
.ov{position:absolute;inset:0;background:rgba(6,18,17,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out;overscroll-behavior:contain}
@media (min-width:640px){.ov{align-items:center;padding:24px}.sheet{max-width:500px;border-radius:20px;padding-bottom:22px}}
.sheet-c{max-width:420px}
.sheet-c h2{font-size:1.2rem;margin-bottom:8px}
.sheet-c p{color:var(--muted);margin-bottom:18px}
@keyframes sobe{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font-size:1.25rem;letter-spacing:-.01em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.form{display:flex;flex-direction:column;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:600;min-width:0}
.campo small{font-weight:500}
.campo input,.campo select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-weight:500;-webkit-appearance:none;appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.campo input[type="date"]{min-height:46px}
.moeda{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding-left:12px}
.moeda i{font-style:normal;color:var(--muted);font-weight:700}
.campo .moeda input{border:0;background:transparent;font-size:1.35rem;font-weight:700;padding:9px 12px 9px 8px}
.campo .moeda input:focus-visible{outline:none}
.moeda:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:0;padding:3px;margin:0;background:var(--soft);border-radius:12px;min-width:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--muted);font-size:.95rem}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.cores{display:flex;flex-wrap:wrap;gap:10px;border:0;padding:0;margin:0}
.cores legend{font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:8px;padding:0}
.cores label{position:relative}
.cores input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.cores span{display:block;width:34px;height:34px;border-radius:50%}
.cores input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cores input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.acoes{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:4px}
.acoes .btn,.acoes .btn-perigo-cheio{flex:1}
@media (min-width:640px){.acoes .btn,.acoes .btn-perigo-cheio{flex:none}}
.erro{color:var(--neg);font-weight:600;font-size:.92rem}
.cat-h{font-size:.95rem;font-weight:700;margin:6px 0 -4px}
.cat-l .linha{padding:4px 4px 4px 12px}
.cat-l .t1{flex:1}

/* despesas x receitas */
.escolha{display:grid;gap:10px}
.esc{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.esc:hover{border-color:var(--ink)}
.esc svg{width:24px;height:24px;flex:none;padding:8px;box-sizing:content-box;border-radius:50%;color:#fff}
.esc-desp svg{background:var(--neg)}.esc-rec svg{background:var(--pos)}
.esc strong{display:block;font-size:1.08rem}
.esc small{color:var(--muted);font-size:.88rem}
.lados{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px}
.lado{border:0;background:none;padding:12px 8px;border-radius:11px;font-weight:700;font-size:1rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.lado[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lado-tot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 6px}
.lado-tot div{display:flex;flex-direction:column;min-width:0}
.lado-tot span{font-size:.88rem;color:var(--muted)}
.lado-tot strong{font-size:clamp(1.4rem,6vw,1.7rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lado-tot strong.neg{color:var(--neg)}
.lado-tot .btn-sec{white-space:nowrap;flex:none}
.side .novos{display:flex;flex-direction:column;gap:8px;margin:0 4px 16px}
.side .novos .btn{margin:0}
.btn-rec{background:var(--pos);color:#fff}
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.hist-h{font-size:.86rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.hist .tx{padding:10px 2px}
.hist .link{margin-top:6px}

/* categorias no Dia a dia */
.cats-strip{margin:16px 0 4px}
.cats-h{font-size:.86rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.cats-l{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cat-chip{white-space:nowrap;flex:none}

/* ---------- armazenamento ---------- */
const store={
  col:null,pending:{},queued:{},chains:{},assets:null,sample:null,imgOK:false,sampleOff:false,
  async init(){
    try{
      const c=window.claude;
      if(c&&typeof c.use==='function'){
        c.use('assets').then(a=>{this.assets=a||null;if(S.ready)render()}).catch(()=>{});
        c.use('sample').then(async sm=>{this.sample=sm||null;if(sm){const L=await sm.limits().catch(()=>null);this.imgOK=!!(L&&L.images)}if(S.ready)render()}).catch(()=>{});
        const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
        const id=user?await user.id():null;
        if(db&&id){this.col=db.collection('data/users/'+id);S.mode='sync';render();this.subscribe();return}
      }
    }catch(e){}
    this.local();
  },
  subscribe(){
    this.col.onSnapshot(snap=>{
      let config=null;const months={};
      for(const d of snap.docs){
        const data=d.data();if(!data)continue;
        if(d.id==='config')config=clone(data);
        else if(d.id.indexOf('m-')===0)months[d.id.slice(2)]=Array.isArray(data.lanc)?clone(data.lanc):[];
      }
      if(!this.pending.config)S.config=novoConfig(config);
      const keys=new Set(Object.keys(months).concat(Object.keys(S.months)));
      keys.forEach(ym=>{if(this.pending['m-'+ym])return;if(months[ym]&&months[ym].length)S.months[ym]=months[ym];else delete S.months[ym]});
      S.ready=true;render();
    },err=>{
      S.ready=true;render();
      toast(err&&err.code==='revoked'?'O acesso aos dados foi encerrado nesta visualização.':'A sincronização parou. Recarregue a página para retomar.');
    });
  },
  local(){
    S.mode='local';
    try{const raw=localStorage.getItem(LKEY);if(raw){const d=JSON.parse(raw);S.config=novoConfig(d.config);S.months=d.months||{}}}catch(e){}
    S.ready=true;render();
  },
  saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({config:S.config,months:S.months}))}catch(e){toast('Não foi possível salvar neste aparelho. Exporte um backup.')}},
  write(key){
    if(S.mode!=='sync'){this.saveLocal();return}
    if(this.queued[key])return;
    this.queued[key]=true;
    this.pending[key]=(this.pending[key]||0)+1;
    const run=async()=>{
      this.queued[key]=false;
      const ref=this.col.doc(key);
      const op=()=>{
        if(key==='config')return ref.set(clone(S.config));
        const L=S.months[key.slice(2)]||[];
        return L.length?ref.set({lanc:clone(L)}):ref.delete();
      };
      try{await op()}
      catch(e){
        if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await op()}catch(e2){falhaEscrita(e2)}}
        else falhaEscrita(e);
      }finally{
        this.pending[key]--;if(this.pending[key]<=0)delete this.pending[key];
      }
    };
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(run);
  }
};
function falhaEscrita(e){
  const c=e&&e.code;
  toast(c==='quota_exceeded'?'O espaço de armazenamento do app está cheio. Exclua lançamentos antigos para continuar.':
        c==='invalid_argument'?'Esta alteração não pôde ser salva.':
        'Não foi possível salvar agora. Confira sua conexão e tente de novo.');
}

/* ---------- consultas ---------- */
const catById=id=>S.config.categorias.find(c=>c.id===id);
const metaById=id=>S.config.metas.find(m=>m.id===id);
const contaById=id=>S.config.contas.find(c=>c.id===id);
const lancs=ym=>S.months[ym]||[];
const isPago=t=>t.pago!==undefined?!!t.pago:!!(t.chk||t.contaId||t.comp);
const refMes=(t,m)=>t.chk||t.ref||m;
function findTxYm(id){for(const ym in S.months){const t=S.months[ym].find(x=>x.id===id);if(t)return {tx:t,ym}}return null}
function findTx(id){for(const ym in S.months){const t=S.months[ym].find(x=>x.id===id);if(t)return t}return null}
function resumo(ym){let rec=0,desp=0,apo=0;for(const t of lancs(ym)){if(t.tipo==='receita')rec+=t.valor;else if(t.tipo==='despesa')desp+=t.valor;else if(t.tipo==='aporte')apo+=t.valor}return{rec,desp,apo,saldo:rec-desp-apo}}
function gastoCat(ym){const g={};for(const t of lancs(ym))if(t.tipo==='despesa'){const k=catById(t.catId)?t.catId:'_sem';g[k]=(g[k]||0)+t.valor}return g}
function statusConta(c,ym){
  if(c.paga)return'paga';const cur=ymHoje();
  if(ym<cur)return'atrasada';if(ym>cur)return'futura';
  const d=new Date().getDate();
  if(c.diaR<d)return'atrasada';if(c.diaR===d)return'hoje';if(c.diaR-d<=3)return'breve';return'pendente';
}
function pagosIndex(){const idx={};for(const ym in S.months)for(const t of S.months[ym])if(t.contaId)idx[t.contaId+'|'+(t.ref||ym)]={tx:t,ym};return idx}
function contasMes(ym,idx){
  idx=idx||pagosIndex();
  return S.config.contas.map(c=>{
    const d=diffM(c.inicio,ym);if(d<0)return null;
    if(c.tipo==='parcela'&&d>=c.parcelas)return null;
    const p=idx[c.id+'|'+ym],tx=p?p.tx:null;
    const r=Object.assign({},c,{n:d+1,paga:!!tx,txId:tx?tx.id:null,txYm:p?p.ym:null,txValor:tx?tx.valor:null,comp:tx&&tx.comp?tx.comp:null,diaR:Math.min(c.dia,diasNoMes(ym))});
    r.status=statusConta(r,ym);return r;
  }).filter(Boolean).sort((a,b)=>a.diaR-b.diaR);
}
function guardado(m){let s=m.inicial||0;for(const ym in S.months)for(const t of S.months[ym])if(t.tipo==='aporte'&&t.metaId===m.id)s+=t.valor;return s}
const STATUS_TXT={atrasada:'Atrasada',hoje:'Vence hoje',breve:'Vence em breve'};

/* ---------- mutações ---------- */
function salvarTx(n,ymAnt){
  const ym=n.data.slice(0,7);
  if(ymAnt&&ymAnt!==ym){S.months[ymAnt]=lancs(ymAnt).filter(t=>t.id!==n.id);if(!S.months[ymAnt].length)delete S.months[ymAnt];store.write('m-'+ymAnt)}
  const L=lancs(ym).slice();const i=L.findIndex(t=>t.id===n.id);if(i>=0)L[i]=n;else L.push(n);
  S.months[ym]=L;store.write('m-'+ym);render();
}
function excluirTx(id,ym){S.months[ym]=lancs(ym).filter(t=>t.id!==id);if(!S.months[ym].length)delete S.months[ym];store.write('m-'+ym);render()}
function salvarConfig(){store.write('config');render()}

function barra(v,l,cls){const p=l>0?v/l:0;const k=cls||(p>1?'estouro':p>=.8?'alerta':'');return '<span class="barra '+k+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(Math.min(p,1)*100)+'"><span style="width:'+(Math.min(p,1)*100).toFixed(1)+'%"></span></span>'}
function linhaConta(c){
  const cat=catById(c.catId);
  const info=['vence dia '+c.diaR];if(c.tipo==='parcela')info.push('parcela '+c.n+' de '+c.parcelas);
  const st=STATUS_TXT[c.status];
  const btn=c.paga?'<button class="pill pago" data-action="desfazer-conta" data-id="'+c.id+'" aria-label="Paga. Toque para desfazer o pagamento de '+esc(c.nome)+'" title="Paga">'+ic.check+'</button>':'<button class="pill" data-action="pagar-conta" data-id="'+c.id+'">Paguei</button>';
  const vc=c.comp?'<button class="ic-btn" data-action="ver-comp" data-id="'+c.txId+'" aria-label="Ver comprovante de '+esc(c.nome)+'">'+ic.clip+'</button>':'';
  return '<li class="linha"><button class="linha-main" data-action="edit-conta" data-id="'+c.id+'"><span class="dot" style="background:'+(cat?cat.cor:'var(--muted)')+'"></span><span class="txt"><span class="t1">'+esc(c.nome)+'</span><span class="t2">'+info.join(', ')+(st?' <em class="st st-'+c.status+'">'+st+'</em>':'')+'</span></span></button><span class="val">'+money(c.paga?c.txValor:c.valor)+'</span>'+vc+btn+'</li>';
}
function linhaTx(t){
  let cor='var(--muted)',t1,t2=[];
  if(t.tipo==='aporte'){
    const m=metaById(t.metaId);cor='var(--save)';
    t1=t.desc||((t.valor<0?'Retirada de ':'Guardado para ')+(m?m.nome:'meta excluída'));
    t2.push(m?'Meta: '+m.nome:'Meta excluída');
  }else{
    const c=catById(t.catId);if(c)cor=c.cor;
    t1=t.desc||(c?c.nome:'Sem categoria');
    t2.push(c?c.nome:'Sem categoria');
    if(t.tipo==='despesa'&&t.pag)t2.push(t.pag);
  }
  const sinal=t.tipo==='receita'?'+ ':t.tipo==='despesa'?'− ':(t.valor<0?'− ':'');
  const ehD=t.tipo==='despesa',ok=ehD&&isPago(t);
  const btn='<button class="tx" data-action="edit-tx" data-id="'+t.id+'"><span class="dot" style="background:'+cor+'"></span><span class="txt"><span class="t1">'+esc(t1)+'</span><span class="t2">'+(ehD?'<span class="st-pg'+(ok?' ok':'')+'">'+(ok?'Pago':'A pagar')+'</span>, ':'')+esc(t2.join(', '))+(t.comp?'<span class="clip" title="Com comprovante">'+ic.clip+'</span>':'')+'</span></span><span class="val v-'+t.tipo+'">'+sinal+money(Math.abs(t.valor))+'</span></button>';
  if(!ehD)return '<li>'+btn+'</li>';
  return '<li class="tx-l"><button class="chk-mini'+(ok?' ok':'')+'" data-action="tx-pago" data-id="'+t.id+'" aria-label="'+esc(t1)+(ok?': pago. Toque para desmarcar':': a pagar. Toque para marcar como pago')+'"><span class="chk-box" aria-hidden="true">'+(ok?ic.check:'')+'</span></button>'+btn+'</li>';
}
function linhaOrc(c,g,l){
  const r=l-g;
  return '<li><button class="orc-btn" data-action="limite" data-id="'+c.id+'"><span class="orc-top"><span class="nome"><span class="dot" style="background:'+c.cor+'"></span>'+esc(c.nome)+'</span><span class="val">'+money(g)+' <small>de '+money(l)+'</small></span></span>'+barra(g,l)+'<span class="orc-bot"><span class="'+(r<0?'neg':'')+'">'+(r>=0?'Faltam '+money(r):'Passou '+money(-r))+'</span><span>'+Math.round(g/l*100)+'%</span></span></button></li>';
}

/* ---------- telas ---------- */
function vInicio(){
  const r=resumo(S.ym),mes=mesNome(S.ym);
  const apoPos=Math.max(r.apo,0),saidas=r.desp+apoPos,escala=Math.max(r.rec,saidas,1),sobra=Math.max(r.rec-saidas,0);
  const pct=v=>(v/escala*100).toFixed(2)+'%';
  let h='<section class="hero"><p class="hero-l">Saldo de '+mes+'</p><p class="hero-v'+(r.saldo<0?' neg':'')+'" data-n="'+r.saldo+'">'+money(r.saldo)+'</p>'+
    '<p class="hero-e">'+(r.rec>0?'Receitas do mês: '+money(r.rec):'Nenhuma receita lançada em '+mes)+'</p>'+
    '<div class="regua" role="img" aria-label="Despesas '+money(r.desp)+', guardou '+money(r.apo)+', sobrou '+money(sobra)+'">'+
      (r.desp>0?'<span class="s-desp" style="width:'+pct(r.desp)+'"></span>':'')+

function disponivel(ym){
  const real=realizado(ym),ids=new Set();let rec=0,desp=0,recP=0,despP=0,temPlano=false;
  for(const c of S.config.categorias){
    ids.add(c.id);const p=planoVal(ym,c.id),l=real[c.id]||0;if(p!=null)temPlano=true;
    const v=Math.max(p||0,l);
    if(c.tipo==='receita'){rec+=v;recP+=Math.max(0,(p||0)-l)}else{desp+=v;despP+=Math.max(0,(p||0)-l)}
  }
  let apo=0;
  for(const t of lancs(ym)){
    if(t.tipo==='aporte'){apo+=t.valor;continue}
    if(t.catId&&ids.has(t.catId))continue;
    if(t.tipo==='receita')rec+=t.valor;else if(t.tipo==='despesa')desp+=t.valor;
  }
  return {rec,desp,apo,livre:rec-desp-apo,recP,despP,temPlano};
}
function blocoDisponivel(ym){
  const atual=ymHoje();if(ym<atual)return '';
  const d=disponivel(ym),mes=mesNome(ym);
  if(!d.rec&&!d.desp)return '';
  let porDia='';
  if(ym===atual){
    const hj=Number(hoje().slice(8)),dias=diasNoMes(ym)-hj+1;
    porDia=d.livre>0?'≈ '+money(d.livre/dias)+' por dia nos próximos '+dias+(dias===1?' dia':' dias'):'Os gastos previstos passam do que entra no mês';
  }else porDia=d.livre>=0?'Previsto para '+mes+' de '+ym.slice(0,4):'Previsto: vai faltar dinheiro em '+mes;
  return '<section class="bloco card-tech disp"><p class="disp-l">'+(ym===atual?'Ainda pode gastar em '+mes:'Deve sobrar em '+mes)+'</p>'+
    '<p class="disp-v'+(d.livre<0?' neg':'')+'" data-n="'+d.livre+'">'+money(d.livre)+'</p><p class="disp-e">'+porDia+'</p>'+
    '<dl class="disp-dl"><div><dt>Entra no mês</dt><dd>'+money(d.rec)+'</dd></div><div><dt>Contas e gastos</dt><dd>'+money(d.desp)+'</dd></div><div><dt>Guardado</dt><dd>'+money(d.apo)+'</dd></div></dl>'+
    '<p class="dica">'+(d.temPlano?'Conta com o seu Plano: o que ainda falta pagar ('+money(d.despP)+') já está descontado.':'Sem plano para '+mes+'. <button class="link" data-action="nav" data-view="plano">Preencha o Plano</button> pra essa conta ficar mais certa.')+'</p></section>';
}
function blocoGastos(ym){
  const g={};let tot=0;
  for(const t of lancs(ym))if(t.tipo==='despesa'){const k=catById(t.catId)?t.catId:'_sem';g[k]=(g[k]||0)+t.valor;tot+=t.valor}
  const mes=mesNome(ym);
  if(!tot)return '<section class="bloco"><div class="bloco-h"><h2>Para onde foi o dinheiro</h2></div><p class="nada">Nenhuma despesa lançada em '+mes+'.</p></section>';
  let L=Object.keys(g).map(k=>({k,v:g[k],c:catById(k)})).sort((a,b)=>b.v-a.v);
  if(L.length>7){const resto=L.slice(6).reduce((a,x)=>a+x.v,0);L=L.slice(0,6).concat([{k:'_out',v:resto,c:null,outras:true}])}
  const mx=L[0].v;
  return '<section class="bloco"><div class="bloco-h"><h2>Para onde foi o dinheiro</h2><span class="dica">'+money(tot)+'</span></div><ul class="lista painel rk">'+L.map(x=>{
    const nome=x.outras?'Outras':x.c?x.c.nome:'Sem categoria',cor=x.c?x.c.cor:'var(--muted)',pc=Math.round(x.v/tot*100);
    return '<li><div class="rk-l"><span class="nome"><span class="dot" style="background:'+cor+'"></span>'+esc(nome)+'</span><span class="val">'+money(x.v)+' <small>'+pc+'%</small></span></div><span class="rk-bar" aria-hidden="true"><i style="width:'+(x.v/mx*100).toFixed(1)+'%"></i></span></li>';
  }).join('')+'</ul></section>';
}
function bloco6Meses(ym){
  const M=[];for(let i=5;i>=0;i--)M.push(addM(ym,-i));
  const R=M.map(m=>{const r=resumo(m);return {m,rec:r.rec,desp:r.desp,saldo:r.rec-r.desp}});
  if(!R.some(r=>r.rec||r.desp))return '';
  const mx=Math.max(...R.map(r=>Math.max(r.rec,r.desp)),1);
  const sel=Math.min(5,Math.max(0,S.g6==null?5:S.g6));
  const info=i=>{const r=R[i];return cap(mesNome(r.m))+': entrou '+money(r.rec)+' · saiu '+money(r.desp)+' · '+(r.saldo>=0?'sobrou ':'faltou ')+money(Math.abs(r.saldo))};
  return '<section class="bloco"><div class="bloco-h"><h2>Últimos 6 meses</h2></div><div class="painel card-tech"><div class="g6" role="group" aria-label="Receitas e despesas dos últimos 6 meses">'+R.map((r,i)=>
    '<button class="g6-col" data-action="g6" data-i="'+i+'" aria-pressed="'+(i===sel)+'" aria-label="'+esc(info(i))+'" title="'+esc(info(i))+'"><i class="r" style="height:'+(r.rec/mx*100).toFixed(1)+'%"></i><i class="d" style="height:'+(r.desp/mx*100).toFixed(1)+'%"></i></button>').join('')+
    '</div><div class="g6-rot" aria-hidden="true">'+M.map(m=>'<span>'+cap(MESES_C[Number(m.slice(5))-1])+'</span>').join('')+'</div>'+
    '<div class="g6-leg"><span><b style="background:var(--bar-pos)"></b>Receitas</span><span><b style="background:var(--bar-neg)"></b>Despesas</span></div>'+
    '<p class="g6-info" data-g6info aria-live="polite">'+esc(info(sel))+'</p></div></section>';

function chkIndex(ym){
  const idx={};
  for(const m in S.months)for(const t of S.months[m])if(t.tipo==='despesa'&&t.catId){const ref=t.chk||t.ref||m;if(ref===ym)(idx[t.catId]=idx[t.catId]||[]).push({tx:t,ym:m})}
  return idx;
}
function vencInfo(c,ym){
  if(!c.dia)return null;
  const dR=Math.min(c.dia,diasNoMes(ym));
  if(ym!==ymHoje())return {txt:'vence dia '+dR,cls:'',diff:null};
  const diff=dR-Number(hoje().slice(8));
  if(diff<0)return {txt:'atrasada há '+(-diff)+(diff===-1?' dia':' dias'),cls:'atrasada',diff};
  if(diff===0)return {txt:'vence hoje',cls:'hoje',diff};
  if(diff===1)return {txt:'vence amanhã',cls:'breve',diff};
  if(diff<=3)return {txt:'vence em '+diff+' dias',cls:'breve',diff};
  return {txt:'vence dia '+dR,cls:'',diff};
}
function avisosMes(){
  const ym=ymHoje(),idx=chkIndex(ym),out=[];
  for(const c of S.config.categorias){
    if(c.tipo!=='despesa'||!c.dia)continue;
    const P=idx[c.id]||[];if(P.length&&P.every(p=>isPago(p.tx)))continue;
    const vi=vencInfo(c,ym);if(!vi||!vi.cls)continue;
    const pend=P.filter(p=>!isPago(p.tx)).reduce((a,p)=>a+p.tx.valor,0),pv=planoVal(ym,c.id);
    out.push({nome:c.nome,acao:'chk',id:c.id,vi,valor:pend||pv||0});
  }
  for(const ct of contasMes(ym)){
    if(ct.paga||['atrasada','hoje','breve'].indexOf(ct.status)<0)continue;
    const diff=ct.diaR-Number(hoje().slice(8));
    out.push({nome:ct.nome,acao:'pagar-conta',id:ct.id,vi:{txt:diff<0?'atrasada há '+(-diff)+(diff===-1?' dia':' dias'):diff===0?'vence hoje':diff===1?'vence amanhã':'vence em '+diff+' dias',cls:diff<0?'atrasada':diff===0?'hoje':'breve',diff},valor:ct.valor});
  }
  return out.sort((a,b)=>a.vi.diff-b.vi.diff);
}
function blocoAvisos(){
  if(S.ym!==ymHoje())return '';
  const A=avisosMes();if(!A.length)return '';
  return '<section class="bloco card-tech avisos"><div class="bloco-h"><h2>Avisos</h2><span class="dica">'+A.length+(A.length===1?' conta':' contas')+'</span></div><ul class="lista">'+A.slice(0,6).map(a=>
    '<li class="av-l"><span class="av-ic '+a.vi.cls+'">'+ic.sino+'</span><span class="txt"><span class="t1">'+esc(a.nome)+'</span><span class="t2"><span class="st-txt '+a.vi.cls+'">'+a.vi.txt+'</span>'+(a.valor?' · '+money(a.valor):'')+'</span></span><button class="pill" data-action="'+a.acao+'" data-id="'+a.id+'">Pagar</button></li>').join('')+
    '</ul></section>';

function planoVal(ym,catId){
  const m=S.config.plano[ym];
  if(m&&Object.prototype.hasOwnProperty.call(m,catId))return m[catId]==null?null:Number(m[catId]);
  const c=catById(catId),l=S.config.orcamento[catId];
  return c&&c.tipo==='despesa'&&l>0?l:null;
}
function realizado(ym){const r={};for(const t of lancs(ym))if((t.tipo==='receita'||t.tipo==='despesa')&&t.catId)r[t.catId]=(r[t.catId]||0)+t.valor;return r}
function resumoPlano(ym){
  let rec=0,desp=0,tem=false;
  for(const c of S.config.categorias){const v=planoVal(ym,c.id);if(v==null)continue;tem=true;if(c.tipo==='receita')rec+=v;else desp+=v}
  return {rec,desp,saldo:rec-desp,tem};
}

async function copiarPlano(ym){

    root.hidden=false;document.body.classList.add('lock');
    const k=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();done(false)}};

/* ---------- voz e texto ---------- */
const semAcento=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function numBR(x){
  x=String(x).trim();
  if(x.indexOf(',')>=0)return Number(x.replace(/\./g,'').replace(',','.'));
  if(/^\d{1,3}(\.\d{3})+$/.test(x))return Number(x.replace(/\./g,''));
  return Number(x);
}
function interpretar(frase){
  const out={tipo:null,catId:null,valor:null,data:null,pag:null,desc:''};
  let t=' '+semAcento(frase).replace(/r\$\s*/g,' ').replace(/\s+/g,' ')+' ';
  const tira=re=>{t=t.replace(re,' ')};
  // data
  const hj=hoje(),dd=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  if(/\banteontem\b/.test(t)){out.data=dd(2);tira(/\banteontem\b/)}
  else if(/\bontem\b/.test(t)){out.data=dd(1);tira(/\bontem\b/)}
  else if(/\bhoje\b/.test(t)){out.data=hj;tira(/\bhoje\b/)}
  const md=t.match(/\bdia (\d{1,2})\b/);
  if(md){const d=Number(md[1]),ym=ymHoje();if(d>=1&&d<=diasNoMes(ym))out.data=ym+'-'+pad(d);tira(/\bdia \d{1,2}\b/)}
  // forma de pagamento
  const PG=[[/\b(no |via |de |por |pelo )?pix\b/,'Pix'],[/\b(no |em |pelo )?(cartao de )?debito\b/,'Débito'],[/\b(no )?cartao( de credito)?\b|\bno credito\b/,'Crédito'],[/\b(em |no )?dinheiro\b/,'Dinheiro'],[/\b(no |via |por )?boleto\b/,'Boleto']];
  for(const [re,v] of PG)if(re.test(t)){out.pag=v;tira(re);break}
  // valor
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*mil(?:\s*e\s*(\d{1,3}))?/);
  if(m){out.valor=numBR(m[1].replace('.',','))*1000+(m[2]?Number(m[2]):0);tira(/(\d+(?:[.,]\d+)?)\s*mil(?:\s*e\s*(\d{1,3}))?/)}
  if(out.valor==null){m=t.match(/(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:reais|real|conto|contos)?\s*e\s*(\d{1,2})\s*(?:centavos?)?(?=\s|$)/);
    if(m){out.valor=numBR(m[1])+Number(m[2])/100;t=t.replace(m[0],' ')}}
  if(out.valor==null){m=t.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+,\d{1,2}|\d+\.\d{1,2}(?!\d)|\d+)\s*(centavos?)?/);
    if(m){out.valor=m[2]?Number(m[1])/100:numBR(m[1]);t=t.replace(m[0],' ')}}
  if(out.valor!=null)out.valor=Math.round(out.valor*100)/100;
  // categoria
  let best=null,bs=0;
  for(const c of S.config.categorias){
    const n=semAcento(c.nome).trim();let sc=0;
    if(n&&t.indexOf(' '+n+' ')>=0)sc=100+n.length;
    else for(const w of n.split(/[^a-z0-9]+/))if(w.length>=3&&new RegExp('\\b'+w+'\\b').test(t))sc=Math.max(sc,w.length);
    if(sc>bs){bs=sc;best=c}
  }
  if(best){out.catId=best.id;out.tipo=best.tipo;for(const w of semAcento(best.nome).split(/[^a-z0-9]+/))if(w.length>=3)tira(new RegExp('\\b'+w+'\\b','g'))}
  if(!out.tipo)out.tipo=/\b(recebi|recebido|ganhei|entrou|caiu|receita|salario|comissao|bonus|reembolso)\b/.test(t)?'receita':'despesa';
  const resto=t.replace(/\b(paguei|gastei|comprei|recebi|recebido|ganhei|entrou|caiu|reais|real|centavos?|conto|contos|de|do|da|dos|das|no|na|em|com|um|uma|o|a|e|pra|para|pro|valor|foi|deu|uns|umas)\b/g,' ').replace(/\s+/g,' ').trim();
  if(resto.length>=3&&!best)out.desc=cap(resto);
  return out;
}

      mic.addEventListener('click',()=>{
        if(ouvindo){try{rec.stop()}catch(e){}return}

          rec.onerror=e=>{parar();st.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'O microfone não foi liberado. Permita nas configurações ou escreva abaixo.':e.error==='no-speech'?'Não ouvi nada. Toque e tente de novo.':'Não consegui ouvir agora. Escreva abaixo.'};
          rec.onend=()=>{parar();if(inp.value.trim()&&ultimo&&ultimo.valor!=null)f.querySelector('button[type=submit]').focus()};

        }catch(e){parar();st.textContent='O reconhecimento de voz não funcionou aqui. Escreva abaixo ou use o microfone do teclado.'}

    });
  });
}

const icsTxt=t=>String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
async function compartilharArquivo(nome,tipo,conteudo,titulo){
  const blob=new Blob([conteudo],{type:tipo});
  try{const file=new File([blob],nome,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:titulo});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
function itensLembrete(){
  const L=[];
  for(const c of S.config.categorias)if(c.tipo==='despesa'&&c.dia)L.push({uid:'cat-'+c.id,nome:c.nome,dia:c.dia,count:null});
  const atual=ymHoje();
  for(const ct of S.config.contas){
    let count=null;
    if(ct.tipo==='parcela'){const fim=addM(ct.inicio,ct.parcelas-1);if(fim<atual)continue;count=diffM(atual<ct.inicio?ct.inicio:atual,fim)+1}
    L.push({uid:'conta-'+ct.id,nome:ct.nome,dia:ct.dia,count,inicio:ct.inicio>atual?ct.inicio:null});
  }
  return L;
}
async function gerarLembretes(){
  const L=itensLembrete();
  if(!L.length){toast('Coloque o dia de vencimento nas categorias de despesa primeiro');return}
  const agora=new Date(),stamp=agora.getUTCFullYear()+pad(agora.getUTCMonth()+1)+pad(agora.getUTCDate())+'T'+pad(agora.getUTCHours())+pad(agora.getUTCMinutes())+'00Z';
  const hj=hoje(),ev=[];
  for(const it of L){
    const d=Math.min(it.dia,28);
    let ym=it.inicio||ymHoje();if(!it.inicio&&ym+'-'+pad(d)<hj)ym=addM(ym,1);
    const ini=ym.replace('-','')+pad(d);
    ev.push(['BEGIN:VEVENT','UID:'+it.uid+'@financas-tomsoares10','DTSTAMP:'+stamp,'DTSTART:'+ini+'T090000','DTEND:'+ini+'T091500',
      'RRULE:FREQ=MONTHLY;BYMONTHDAY='+d+(it.count?';COUNT='+it.count:''),
      'SUMMARY:'+icsTxt('Pagar '+it.nome),'DESCRIPTION:'+icsTxt('Vence dia '+it.dia+'. Abra o app Finanças para marcar como pago.'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsTxt('Amanhã: pagar '+it.nome),'TRIGGER:-P1D','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsTxt('Hoje: pagar '+it.nome),'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n'));
  }
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Financas//Lembretes//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Contas a pagar'].join('\r\n')+'\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR\r\n';
  if(await compartilharArquivo('financas-lembretes.ics','text/calendar',ics,'Lembretes de contas'))toast(L.length+(L.length===1?' lembrete pronto':' lembretes prontos')+' para o calendário');
}

const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deB64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function hashPin(pin,sal){return b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(sal+':'+pin)))}
async function faceDisponivel(){try{return !!(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function criarCredencial(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Finanças'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'financas',displayName:'Finanças'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  return b64u(cred.rawId);
}
async function checarFace(id){
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:deB64u(id),transports:['internal']}],userVerification:'required',timeout:60000}});
  return true;
}
function travar(){
  const t=lerTrava();if(!t||document.body.classList.contains('travado'))return;
  closeModal();document.body.classList.add('travado');
  let pin='';
  const raiz=document.createElement('div');raiz.id='trava';raiz.setAttribute('role','dialog');raiz.setAttribute('aria-modal','true');raiz.setAttribute('aria-label','App bloqueado');
  raiz.innerHTML='<div class="tv-logo">'+ic.cadeado+'</div><p class="tv-t">Finanças bloqueado</p>'+
    (t.cred?'<button type="button" class="btn" data-tvface>'+ic.face+' Desbloquear com Face ID</button>':'')+
    '<p class="dica">'+(t.cred?'Ou digite seu PIN':'Digite seu PIN')+'</p><div class="tv-pts" data-pts aria-hidden="true">'+'<i></i>'.repeat(t.pin.n)+'</div><p class="tv-msg" data-msg aria-live="assertive"></p>'+
    '<div class="tv-tec">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>'<button type="button" data-k="'+k+'"'+(k===''?' class="vz" tabindex="-1" aria-hidden="true"':'')+(k==='⌫'?' aria-label="Apagar"':'')+'>'+k+'</button>').join('')+'</div>'+
    '<button type="button" class="link" data-esqueci>Esqueci o PIN</button>';
  document.body.appendChild(raiz);
  const pts=raiz.querySelector('[data-pts]'),msg=raiz.querySelector('[data-msg]');
  const pintar=()=>$$('i',pts).forEach((x,i)=>x.classList.toggle('on',i<pin.length));
  const abrir=()=>{document.body.classList.remove('travado');raiz.remove();travaTent=0;document.removeEventListener('keydown',tecla,true)};
  const conferir=async()=>{
    if(Date.now()<travaAte){msg.textContent='Aguarde alguns segundos e tente de novo.';pin='';pintar();return}
    const h=await hashPin(pin,t.pin.sal);
    if(h===t.pin.h)return abrir();
    travaTent++;pin='';pintar();pts.classList.remove('erro');void pts.offsetWidth;pts.classList.add('erro');
    if(travaTent>=5){travaAte=Date.now()+30000;travaTent=0;msg.textContent='Muitas tentativas. Aguarde 30 segundos.'}else msg.textContent='PIN incorreto.';
  };
  const digitar=k=>{msg.textContent='';if(k==='⌫'){pin=pin.slice(0,-1);pintar();return}if(!/^\d$/.test(k)||pin.length>=t.pin.n)return;pin+=k;pintar();if(pin.length===t.pin.n)conferir()};
  const tecla=e=>{if(/^\d$/.test(e.key)){e.preventDefault();digitar(e.key)}else if(e.key==='Backspace'){e.preventDefault();digitar('⌫')}};
  document.addEventListener('keydown',tecla,true);
  raiz.querySelector('.tv-tec').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&b.dataset.k)digitar(b.dataset.k)});
  const bf=raiz.querySelector('[data-tvface]');
  if(bf)bf.addEventListener('click',async()=>{try{await checarFace(t.cred);abrir()}catch(e){msg.textContent='Face ID não confirmou. Use o PIN.'}});
  raiz.querySelector('[data-esqueci]').addEventListener('click',()=>esqueciPin(raiz));
  (bf||raiz.querySelector('[data-k="1"]')).focus();
}
function esqueciPin(raiz){
  const box=document.createElement('div');box.className='sheet sheet-c';box.style.cssText='position:relative;text-align:left;max-width:420px';
  box.innerHTML='<h2>Esqueceu o PIN?</h2><p class="dica" style="margin:8px 0 12px">Sem o PIN ou o Face ID não dá pra abrir os dados, essa é a proteção. A única saída é apagar os dados deste aparelho e depois importar o seu último backup.</p>'+
    '<label class="campo"><span>Para apagar, escreva APAGAR</span><input data-conf autocomplete="off" autocapitalize="characters"></label>'+
    '<div class="acoes" style="margin-top:12px"><button type="button" class="btn-sec" data-volta>Voltar</button><button type="button" class="btn-perigo-cheio" data-apaga disabled>Apagar dados</button></div>';
  raiz.querySelectorAll(':scope>*').forEach(x=>x.hidden=true);raiz.appendChild(box);
  const inp=box.querySelector('[data-conf]'),ap=box.querySelector('[data-apaga]');
  inp.addEventListener('input',()=>{ap.disabled=inp.value.trim().toUpperCase()!=='APAGAR'});
  box.querySelector('[data-volta]').addEventListener('click',()=>{box.remove();raiz.querySelectorAll(':scope>*').forEach(x=>x.hidden=false)});
  ap.addEventListener('click',async()=>{
    try{[LKEY,TRKEY,BKEY].forEach(k=>localStorage.removeItem(k))}catch(e){}
    try{await IDB.limpar()}catch(e){}
    location.reload();
  });
  inp.focus();
}
function modalTrava(){
  const t=lerTrava();
  if(t){
    openModal('<form class="form" novalidate>'+cab('Bloqueio')+'<p class="dica">O app pede '+(t.cred?'Face ID ou ':'')+'PIN ao abrir e quando volta depois de 1 minuto fora.</p>'+
      '<label class="campo"><span>Digite o PIN atual para desligar</span><input name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" data-foco></label><p class="erro" role="alert" hidden></p>'+
      '<div class="acoes"><button type="button" class="btn-sec" data-close>Cancelar</button><button class="btn-perigo-cheio" type="submit">Desligar bloqueio</button></div></form>',
    sheet=>{const f=sheet.querySelector('form'),fail=erroForm(f);f.addEventListener('submit',async e=>{e.preventDefault();if(await hashPin(el(f,'pin').value.trim(),t.pin.sal)!==t.pin.h)return fail('PIN incorreto.');try{localStorage.removeItem(TRKEY)}catch(x){}closeModal();toast('Bloqueio desligado')})});
    return;
  }
  faceDisponivel().then(temFace=>{
    openModal('<form class="form" novalidate>'+cab('Ativar bloqueio')+
      '<div class="bk-info"><strong>Antes de ativar, faça um backup.</strong>Se esquecer o PIN e o Face ID não funcionar, a única saída é apagar os dados deste aparelho e importar o backup.</div>'+
      '<button type="button" class="btn-sec" data-action="backup">'+ic.bk+' Fazer backup agora</button>'+
      '<div class="duas"><label class="campo"><span>Crie um PIN (4 a 6 números)</span><input name="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></label>'+
      '<label class="campo"><span>Repita o PIN</span><input name="p2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></label></div>'+
      (temFace?'<label class="pago-campo"><input type="checkbox" name="face" checked><span class="chk-box" aria-hidden="true">'+ic.check+'</span><span>Usar Face ID ou digital para desbloquear</span></label>':'<p class="dica">Face ID não está disponível neste navegador; o bloqueio vai usar só o PIN.</p>')+
      '<p class="dica">Protege o app contra quem pegar o seu celular desbloqueado. Os dados continuam só neste aparelho.</p>'+
      '<p class="erro" role="alert" hidden></p><div class="acoes"><button type="button" class="btn-sec" data-close>Cancelar</button><button class="btn" type="submit">'+ic.cadeado+' Ativar bloqueio</button></div></form>',
    sheet=>{
      const f=sheet.querySelector('form'),fail=erroForm(f);
      f.addEventListener('submit',async e=>{
        e.preventDefault();
        const p1=el(f,'p1').value.trim(),p2=el(f,'p2').value.trim();
        if(!/^\d{4,6}$/.test(p1))return fail('O PIN precisa ter de 4 a 6 números.');
        if(p1!==p2)return fail('Os dois PINs não são iguais.');
        let cred=null;
        if(el(f,'face')&&el(f,'face').checked){try{cred=await criarCredencial()}catch(x){return fail('O Face ID não foi configurado. Tente de novo ou desmarque a opção para usar só o PIN.')}}
        const sal=b64u(crypto.getRandomValues(new Uint8Array(16)));
        const t2={pin:{sal,h:await hashPin(p1,sal),n:p1.length},cred};
        try{localStorage.setItem(TRKEY,JSON.stringify(t2))}catch(x){return fail('Não foi possível salvar o bloqueio neste aparelho.')}
        closeModal();toast('Bloqueio ativado'+(cred?' com Face ID':''));
      });
    });
  });
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saiuEm=Date.now();else if(saiuEm&&Date.now()-saiuEm>60000&&lerTrava())travar()});

const TKEY='financas-tema';
let tMedia=null;
function lerTema(){try{return localStorage.getItem(TKEY)||'escuro'}catch(e){return 'escuro'}}
function aplicarTema(p){
  const mq=matchMedia('(prefers-color-scheme: light)');
  const t=p==='claro'?'light':p==='auto'?(mq.matches?'light':'dark'):'dark';
  document.documentElement.setAttribute('data-theme',t);
  const tc=$('#tc');if(tc)tc.setAttribute('content',t==='light'?'#F2F5F7':'#070B0E');
  if(tMedia){mq.removeEventListener('change',tMedia);tMedia=null}
  if(p==='auto'){tMedia=()=>aplicarTema('auto');mq.addEventListener('change',tMedia)}
}

function novaCor(){const u=new Set(S.config.categorias.map(c=>c.cor));return CORES.find(c=>!u.has(c))||CORES[S.config.categorias.length%CORES.length]}
function criarCat(nome,tipo){
  const ex=S.config.categorias.find(c=>c.tipo===tipo&&c.nome.toLowerCase()===nome.toLowerCase());
  if(ex)return ex.id;
  const c={id:uid(),nome,tipo,cor:novaCor()};S.config.categorias.push(c);return c.id;
}
function modalCategoria(cat,opt){
  opt=opt||{};const voltar=opt.voltar!==false,tipoIni=opt.tipo||'despesa';
  const ed=!!cat;
  const corIni=cat?cat.cor:novaCor();
  openModal('<form class="form" novalidate>'+cab(ed?'Editar categoria':'Nova categoria')+
    (ed?'<p class="dica">Categoria de '+(cat.tipo==='despesa'?'despesa':'receita')+'</p>':'<fieldset class="seg"><legend class="sr">Tipo</legend><label><input type="radio" name="tipo" value="despesa"'+(tipoIni==='despesa'?' checked':'')+'><span>Despesa</span></label><label><input type="radio" name="tipo" value="receita"'+(tipoIni==='receita'?' checked':'')+'><span>Receita</span></label></fieldset>')+
    '<label class="campo"><span>Nome</span><input name="nome" maxlength="40" autocomplete="off" value="'+esc(cat?cat.nome:'')+'" placeholder="Ex.: mercado, salário" data-foco></label>'+
    '<label class="campo" data-diacampo'+((ed?cat.tipo:tipoIni)==='despesa'?'':' hidden')+'><span>Vence no dia <small>(opcional, para avisos)</small></span><input name="dia" type="number" inputmode="numeric" min="1" max="31" placeholder="Ex.: 10" value="'+(cat&&cat.dia?cat.dia:'')+'"></label>'+
    '<fieldset class="cores"><legend>Cor</legend>'+CORES.map(c=>'<label><input type="radio" name="cor" value="'+c+'"'+(c===corIni?' checked':'')+' aria-label="Cor '+c+'"><span style="background:'+c+'"></span></label>').join('')+'</fieldset>'+
    '<p class="erro" role="alert" hidden></p>'+
    '<div class="acoes">'+(ed?'<button type="button" class="btn-perigo" data-del>Excluir</button>':'')+'<button type="button" class="btn-sec" data-voltar>'+(voltar?'Voltar':'Cancelar')+'</button><button class="btn" type="submit">'+(ed?'Salvar alterações':'Criar categoria')+'</button></div></form>',
  sheet=>{
    const f=sheet.querySelector('form'),fail=erroForm(f);
    f.querySelector('[data-voltar]').addEventListener('click',()=>voltar?modalCategorias():closeModal());
    f.addEventListener('change',e=>{if(e.target.name==='tipo')f.querySelector('[data-diacampo]').hidden=e.target.value!=='despesa'});
    const del=f.querySelector('[data-del]');if(del)del.addEventListener('click',()=>excluirCategoria(cat.id,voltar));
    f.addEventListener('submit',e=>{
      e.preventDefault();
      const nome=el(f,'nome').value.trim();if(!nome)return fail('Dê um nome para a categoria.');
      const tipo=ed?cat.tipo:el(f,'tipo').value;
      if(S.config.categorias.some(c=>c.tipo===tipo&&c.nome.toLowerCase()===nome.toLowerCase()&&(!ed||c.id!==cat.id)))return fail('Já existe uma categoria com esse nome.');
      const cor=el(f,'cor').value||corIni,dRaw=el(f,'dia').value.trim();let dia=null;
      if(tipo==='despesa'&&dRaw){dia=parseInt(dRaw,10);if(!(dia>=1&&dia<=31))return fail('O dia de vencimento vai de 1 a 31.')}
      if(ed){const c=catById(cat.id);c.nome=nome;c.cor=cor;if(dia)c.dia=dia;else delete c.dia}
      else{const c={id:uid(),nome,tipo,cor};if(dia)c.dia=dia;S.config.categorias.push(c)}
      salvarConfig();if(voltar)modalCategorias();else closeModal();toast(ed?'Categoria atualizada':'Categoria criada');
    });
  });
}
async function excluirCategoria(id,voltar){
  const c=catById(id);if(!c)return;
  const usada=Object.keys(S.months).some(ym=>S.months[ym].some(t=>t.catId===id));
  const ok=await confirmar({titulo:'Excluir a categoria '+c.nome+'?',texto:usada?'As despesas ou receitas dela vão aparecer como Sem categoria, e o planejamento dela será apagado.':'Ela ainda não foi usada.',botao:'Excluir categoria'});
  if(!ok)return;
  S.config.categorias=S.config.categorias.filter(x=>x.id!==id);
  delete S.config.orcamento[id];
  for(const m in S.config.plano)if(S.config.plano[m])delete S.config.plano[m][id];
  S.config.contas.forEach(ct=>{if(ct.catId===id)ct.catId=null});
  salvarConfig();if(voltar===false)closeModal();else modalCategorias();toast('Categoria excluída');
}

  sheet=>{
    const f=sheet.querySelector('form'),fail=erroForm(f);
    f.addEventListener('submit',e=>{

const canvasJpeg=cv=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.88));
async function pdfParaJpeg(file){
  const lib=await carregarPdf();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
  try{
    const page=await doc.getPage(1),v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(3,1800/Math.max(v1.width,v1.height))});
    const cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    return await canvasJpeg(cv);
  }finally{doc.destroy()}
}
const blobParaDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function decodificar(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file)}catch(e){}}
  const url=await blobParaDataUrl(file);
  return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url});
}
async function imagemParaJpeg(file,max){
  const img=await decodificar(file);const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const k=Math.min(1,max/Math.max(w,h));const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
  if(img.close)img.close();
  return await canvasJpeg(cv);
}

const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessP=null;
function carregarTess(){
  if(!tessP)tessP=loadScript(TESS_URL).then(()=>{if(!window.Tesseract)throw new Error('tess');return window.Tesseract}).catch(e=>{tessP=null;throw e});
  return tessP;
}
async function prepOCR(blob){
  const img=await decodificar(blob);const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const k=Math.max(1,Math.min(3,1400/w,6000/h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,cv.width,cv.height);
  if(img.close)img.close();
  try{
    const d=ctx.getImageData(0,0,cv.width,cv.height),a=d.data;
    for(let i=0;i<a.length;i+=4){let y=.299*a[i]+.587*a[i+1]+.114*a[i+2];y=y>200?255:y<70?0:(y-70)*255/130;a[i]=a[i+1]=a[i+2]=y}
    ctx.putImageData(d,0,0);
  }catch(e){}
  return cv;
}
async function lerTextoImagem(blob,prog){
  prog('Preparando o leitor (na primeira vez ele baixa uns 7 MB)…',0.05);
  const T=await carregarTess();
  const w=await T.createWorker('por',1,{logger:m=>{
    if(m.status==='recognizing text')prog('Lendo o comprovante… '+Math.round((m.progress||0)*100)+'%',0.35+0.65*(m.progress||0));
    else prog('Preparando o leitor…',0.05+0.3*(m.progress||0));
  }});
  try{const cv=await prepOCR(blob);const r=await w.recognize(cv);return (r&&r.data&&r.data.text)||''}
  finally{try{await w.terminate()}catch(e){}}
}
async function pdfTexto(file){
  const lib=await carregarPdf();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,disableFontFace:true}).promise;
  try{
    const page=await doc.getPage(1),tc=await page.getTextContent(),rows={};
    for(const it of tc.items){const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})}
    return Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')).join('\n');
  }finally{doc.destroy()}
}
const MESES_AB={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function analisarComprovante(txt){
  const linhas=String(txt||'').split(/\r?\n/).map(l=>l.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const N=linhas.map(semAcento);
  const reV=/(?:r\s?\$|rs)?\s*(\d{1,3}(?:[.\s]\d{3})+,\s?\d{2}|\d+,\s?\d{2}|\d{1,3}(?:\.\d{3})+\.\d{2})(?!\d)/i;
  const val=l=>{const m=l.match(reV);if(!m)return null;let x=m[1].replace(/\s/g,'');if(x.indexOf(',')<0){const i=x.lastIndexOf('.');x=x.slice(0,i).replace(/\./g,'')+','+x.slice(i+1)}return Number(x.replace(/\./g,'').replace(',','.'))};
  const r={valor:null,data:null,fav:null,catId:null,texto:linhas.join('\n')};
  const PRI=[/valor\s*(total\s*)?pago/,/total\s*pago/,/valor\s*total/,/valor\s*(do\s*)?pix/,/valor\s*(da|do)\s*(transferencia|transacao|pagamento|documento|boleto)/,/valor\s*(do\s*)?titulo/,/^valor\b|\bvalor\b/];
  for(const re of PRI){
    for(let i=0;i<N.length&&r.valor==null;i++){
      if(!re.test(N[i])||/original|desconto|juros|multa|tarifa|encargo|abatimento/.test(N[i]))continue;
      r.valor=val(linhas[i]);if(r.valor==null&&linhas[i+1])r.valor=val(linhas[i+1]);
    }
    if(r.valor!=null)break;
  }
  if(r.valor==null){const todos=linhas.map(val).filter(v=>v!=null);if(todos.length)r.valor=Math.max(...todos)}
  if(r.valor!=null&&!(r.valor>0&&r.valor<10000000))r.valor=null;
  const dataDe=l=>{
    let m=l.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4}|\d{2})(?!\d)/);
    if(m){const y=m[3].length===2?2000+Number(m[3]):Number(m[3]);return y+'-'+pad(Number(m[2]))+'-'+pad(Number(m[1]))}
    m=semAcento(l).match(/(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?\s*(?:de\s*)?(\d{4})/);
    if(m)return m[3]+'-'+pad(MESES_AB[m[2]])+'-'+pad(Number(m[1]));
    return null;
  };
  const okData=d=>{if(!d)return false;const [y,mo,dd]=d.split('-').map(Number);return y>=2020&&y<=2100&&mo>=1&&mo<=12&&dd>=1&&dd<=31&&d<=addDias(hoje(),1)};
  const PD=[/data\s*(do|de)\s*pagamento/,/pago\s*em|realizad|efetuad/,/data\s*(da|de)?\s*(transacao|transferencia)|data\s*\/\s*hora/,/\bdata\b/];
  for(const re of PD){
    for(let i=0;i<N.length&&!r.data;i++){if(!re.test(N[i])||/vencimento/.test(N[i]))continue;let d=dataDe(linhas[i]);if(!d&&linhas[i+1])d=dataDe(linhas[i+1]);if(okData(d))r.data=d}
    if(r.data)break;
  }
  if(!r.data)for(const l of linhas){const d=dataDe(l);if(okData(d)){r.data=d;break}}
  const reF=/^(nome\s*(do|da)\s*)?(destinatario|beneficiario|favorecido|recebedor)\b|^(pago|pagamento|enviado|transferido)\s*(para|a)\b|^para\b|^quem\s*recebeu\b/;
  const rotulo=/^(cpf|cnpj|instituicao|agencia|conta|chave|tipo|banco\s*\d|data|valor|id|protocolo|documento|identificacao|descricao)/;
  for(let i=0;i<N.length&&!r.fav;i++){
    if(/^dados\s*d/.test(N[i])||!reF.test(N[i]))continue;
    let resto=linhas[i].replace(/^.*?(destinat[aá]rio|benefici[aá]rio|favorecido|recebedor|para|recebeu)\s*:?\s*/i,'').replace(/\b(CPF|CNPJ)\b.*$/i,'').trim();
    if(!/[a-zà-ú]{3}/i.test(resto)){const nx=linhas[i+1];if(nx&&!rotulo.test(semAcento(nx))&&/[a-zà-ú]{3}/i.test(nx))resto=nx.replace(/\b(CPF|CNPJ)\b.*$/i,'').trim();else resto=''}
    if(resto)r.fav=resto.replace(/[.\s]+$/,'').slice(0,60);
  }
  r.catId=sugerirCat(r.fav);
  return r;
}
function addDias(ds,n){const [y,m,d]=ds.split('-').map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
const chaveFav=f=>semAcento(f||'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(w=>w.length>1).slice(0,3).join(' ');
const GENERICAS=['credito','debito','banco','bco','financeira','financiamento','pagamento','pagamentos','servicos','ltda','cia','casa','sa'];
function sugerirCat(fav){
  if(!fav)return null;
  const k=chaveFav(fav),ap=S.config.apelidos||{};
  if(k&&ap[k]&&catById(ap[k]))return ap[k];
  const F=semAcento(fav),toks=F.split(/[^a-z0-9]+/).filter(x=>x.length>=5);let best=null,bs=0;
  for(const c of S.config.categorias){
    if(c.tipo!=='despesa')continue;
    for(const w of semAcento(c.nome).split(/[^a-z0-9]+/)){
      if(w.length<4||GENERICAS.indexOf(w)>=0)continue;
      const sc=F.indexOf(w)>=0?w.length*2:toks.some(x=>w.indexOf(x)>=0)?w.length*1.5:0;
      if(sc>bs){bs=sc;best=c.id}
    }
  }
  return best;
}

function msgSample(e){const c=e&&e.code;return c==='not_granted'?'A leitura pelo Claude não foi permitida. Escolha a conta abaixo.':c==='rate_limited'?'O Claude está ocupado agora. Escolha a conta abaixo ou tente mais tarde.':c==='image_rejected'?'O Claude não conseguiu usar esta imagem. Escolha a conta abaixo.':'Não consegui ler este comprovante. Escolha a conta abaixo.'}
function msgAsset(e){const c=e&&e.code;return c==='too_large'?'O arquivo é grande demais (limite de 20 MB).':c==='unsupported_type'?'Formato não aceito. Envie JPG, PNG ou PDF.':c==='quota_or_state'?'O espaço para comprovantes está cheio.':'Não foi possível guardar o comprovante agora. Tente de novo.'}
async function subirComp(o){
  const a=store.assets;
  if(!a){const id='c'+uid();await IDB.put(id,o.jpeg);return {id,local:true,tipo:'img',nome:String(o.file&&o.file.name||'comprovante').slice(0,80)}}
  const nome=String(o.file.name||'comprovante').slice(0,80);
  if(o.ehPdf){
    const orig=await a.upload(o.file,{type:'application/pdf'});
    try{const prev=await a.upload(o.jpeg,{type:'image/jpeg'});return {id:orig.id,prev:prev.id,tipo:'pdf',nome}}
    catch(e){a.delete(orig.id).catch(()=>{});throw e}
  }
  const img=await a.upload(o.jpeg,{type:'image/jpeg'});
  return {id:img.id,prev:null,tipo:'img',nome};
}

async function prepararArquivo(file){
  const ehPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  let jpeg;
  try{jpeg=ehPdf?await pdfParaJpeg(file):await imagemParaJpeg(file,2000)}
  catch(e){throw new Error(ehPdf?'Não consegui abrir este PDF. Envie uma foto ou print do comprovante.':'Não consegui abrir este arquivo. Envie em JPG, PNG ou PDF.')}
  return {file,ehPdf,jpeg,dataUrl:await blobParaDataUrl(jpeg)};
}

async function processarComprovante(file){
  const ehPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
  const cands=contasEmAberto();
  openModal('<div class="form">'+cab('Comprovante')+'<div class="comp-prev" data-prev><p class="dica">Abrindo o arquivo…</p></div><p class="lendo" data-status aria-live="polite">Abrindo o arquivo…</p><div class="acoes"><button type="button" class="btn-sec" data-close>Cancelar</button></div></div>');
  const sheet=$('#modal-root .sheet'),vivo=()=>sheet.isConnected,status=t=>{const x=sheet.querySelector('[data-status]');if(x)x.textContent=t};
  let jpeg;
  try{jpeg=ehPdf?await pdfParaJpeg(file):await imagemParaJpeg(file,2000)}
  catch(e){if(vivo())status(ehPdf?'Não consegui abrir este PDF. Envie uma foto ou print do comprovante.':'Não consegui abrir este arquivo. Envie em JPG, PNG ou PDF.');return}
  if(!vivo())return;
  const dataUrl=await blobParaDataUrl(jpeg);
  if(!vivo())return;
  sheet.querySelector('[data-prev]').innerHTML='<img src="'+dataUrl+'" alt="Prévia do comprovante">';
  let leitura=null,aviso='';
  if(leituraOK()){
    status('O Claude está lendo o comprovante…');
    const ctl=new AbortController();compCtl=ctl;
    try{leitura=await store.sample.json(promptComp(cands),{images:jpeg,signal:ctl.signal})}
    catch(e){
      if(e&&e.code==='cancelled')return;
      aviso=msgSample(e);
      if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].indexOf(e.code)>=0)store.sampleOff=true;
    }
    if(compCtl===ctl)compCtl=null;
    if(!vivo())return;
  }else aviso='Escolha abaixo a conta que este comprovante paga.';
  formBaixa({file,ehPdf,jpeg,dataUrl,cands,leitura,aviso});
}
function formBaixa(o){
  const L=o.leitura&&typeof o.leitura==='object'?o.leitura:null;
  const naoComp=!!(L&&L.comprovante===false);
  const escolha=L&&!naoComp&&o.cands.some(x=>x.k===L.escolha)?L.escolha:'';
  const vLido=L&&!naoComp&&Number(L.valor)>0?Math.round(Number(L.valor)*100)/100:null;
  const dLida=L&&!naoComp&&/^\d{4}-\d{2}-\d{2}$/.test(String(L.data||''))?L.data:null;
  let info='';
  if(naoComp)info='<p class="aviso-comp">Isso não parece um comprovante de pagamento'+(L.motivo?': '+esc(L.motivo):'.')+' Se for, escolha a conta abaixo.</p>';
  else if(L){
    info='<div class="lido"><p class="t1">'+(vLido?money(vLido):'Valor não identificado')+(dLida?' pagos em '+fmtData(dLida):'')+'</p>'+(L.favorecido?'<p class="t2">Para '+esc(L.favorecido)+'</p>':'')+(escolha&&L.motivo?'<p class="t2">'+esc(L.motivo)+'</p>':'')+'</div>';
    if(!escolha)info+='<p class="aviso-comp">Não identifiquei a conta com segurança. Escolha qual é.</p>';
    else if(L.confianca==='baixa')info+='<p class="aviso-comp">Não tenho certeza dessa sugestão. Confira antes de confirmar.</p>';
  }else if(o.aviso)info='<p class="aviso-comp">'+esc(o.aviso)+'</p>';
  const opts='<option value="">Escolha a conta</option>'+o.cands.map(x=>'<option value="'+x.k+'"'+(x.k===escolha?' selected':'')+'>'+esc(rotuloCand(x))+'</option>').join('');
  openModal('<form class="form" novalidate>'+cab('Dar baixa')+
    '<div class="comp-prev"><img src="'+o.dataUrl+'" alt="Comprovante"></div>'+info+
    '<label class="campo"><span>'+(escolha?'Conta sugerida':'Conta')+'</span><select name="k">'+opts+'</select></label>'+
    '<div class="duas"><label class="campo"><span>Valor pago</span><span class="moeda"><i>R$</i><input name="valor" inputmode="decimal" autocomplete="off" placeholder="0,00"></span></label>'+
    '<label class="campo"><span>Data do pagamento</span><input type="date" name="data"></label></div>'+
    '<p class="dica" data-dif hidden></p><p class="erro" role="alert" hidden></p>'+
    '<div class="acoes"><button type="button" class="btn-sec" data-close>Cancelar</button><button class="btn" type="submit">Confirmar baixa</button></div></form>',
  sheet=>{
    const f=sheet.querySelector('form'),fail=erroForm(f),vI=el(f,'valor'),dI=el(f,'data'),kI=el(f,'k');
    let mexeuV=false;
    const cand=()=>o.cands.find(x=>x.k===kI.value);
    const dif=()=>{const x=cand(),v=parseValor(vI.value),p=f.querySelector('[data-dif]');if(x&&v>0&&Math.abs(v-x.c.valor)>=0.01){p.textContent='O valor cadastrado nessa conta é '+money(x.c.valor)+'. A baixa usa o valor pago.';p.hidden=false}else p.hidden=true};
    const preencher=()=>{const x=cand();if(!mexeuV)vI.value=valorInput(vLido||(x?x.c.valor:0));dif()};
    vI.addEventListener('input',()=>{mexeuV=true;dif()});
    kI.addEventListener('change',preencher);
    dI.value=dLida||hoje();preencher();
    if(!escolha)kI.focus();
    f.addEventListener('submit',async e=>{
      e.preventDefault();
      const x=cand();if(!x)return fail('Escolha a conta.');
      const v=parseValor(vI.value);if(!(v>0))return fail('Informe o valor pago.');
      const data=dI.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(data))return fail('Informe a data do pagamento.');
      if(pagosIndex()[x.k])return fail('Essa conta já está baixada.');
      const btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Guardando comprovante…';
      let comp;
      try{comp=await subirComp(o)}catch(err){btn.disabled=false;btn.textContent='Confirmar baixa';return fail(msgAsset(err))}
      const c=x.c;
      salvarTx({id:uid(),tipo:'despesa',valor:Math.round(v*100)/100,data,desc:c.tipo==='parcela'?c.nome+' ('+c.n+'/'+c.parcelas+')':c.nome,catId:c.catId||null,pag:c.pag||'Boleto',contaId:c.id,parcela:c.tipo==='parcela'?c.n:null,ref:x.ym,pago:true,comp,criado:Date.now()},null);
      closeModal();toast('Baixa feita: '+c.nome+', '+mesNome(x.ym));
    });
  });
}

  });
}
