/* ---------- backup ---------- */
const BKEY='financas-ultimo-backup';
function ultimoBackup(){try{return Number(localStorage.getItem(BKEY))||0}catch(e){return 0}}
function contarLanc(months){let n=0;for(const k in months||{})n+=(months[k]||[]).length;return n}
const fmtDataHora=ms=>{const d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
function avisoBackup(){
  if(S.mode!=='local'||!contarLanc(S.months))return '';
  const u=ultimoBackup(),dias=u?Math.floor((Date.now()-u)/864e5):null;
  if(u&&dias<30)return '';
  return '<div class="aviso-bk"><span>'+(u?'Seu último backup foi há '+dias+' dias.':'Você ainda não fez nenhum backup.')+'</span><button class="link" data-action="backup">Fazer backup</button></div>';
}
function modalBackup(){
  const u=ultimoBackup(),n=contarLanc(S.months);
  openModal('<div class="form">'+cab('Backup')+
    '<div class="bk-info"><strong>Seus dados ficam só neste aparelho.</strong>Se trocar de celular ou limpar os dados do navegador, eles se perdem. Exporte um backup de vez em quando e guarde o arquivo.</div>'+
    '<p class="dica">'+n+' '+(n===1?'lançamento':'lançamentos')+', '+S.config.categorias.length+' categorias. '+(u?'Último backup: '+fmtDataHora(u)+'.':'Nenhum backup feito ainda.')+'</p>'+
    '<div class="bk-acoes"><button type="button" class="btn" data-exp>'+ic.bk+' Exportar backup</button><button type="button" class="btn-sec" data-imp>Importar backup</button></div>'+
    '<p class="dica">Importar troca todos os dados deste aparelho pelos do arquivo. Sempre pede confirmação.</p>'+
    '<p class="erro" role="alert" hidden></p></div>',
  sheet=>{
    const fail=erroForm(sheet);
    sheet.querySelector('[data-exp]').addEventListener('click',()=>exportarBackup(fail));
    sheet.querySelector('[data-imp]').addEventListener('click',()=>{
      const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
      inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];if(f)importarBackup(f,fail)});
      inp.click();
    });
  });
}
async function exportarBackup(fail){
  const dados={app:'financas',versao:2,exportado:new Date().toISOString(),config:S.config,months:S.months,comprovantes:{}};
  try{for(const [k,b] of await IDB.tudo())if(b)dados.comprovantes[k]=await blobParaDataUrl(b)}catch(e){}
  const nome='financas-backup-'+hoje()+'.json';
  const blob=new Blob([JSON.stringify(dados,null,1)],{type:'application/json'});
  const ok=()=>{try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}closeModal();render();toast('Backup exportado')};
  try{
    const file=new File([blob],nome,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Backup Finanças'});ok();return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);ok();
  }catch(e){fail('Não foi possível exportar o backup neste aparelho.')}
}
async function importarBackup(file,fail){
  let d;
  try{d=JSON.parse(await file.text())}catch(e){return fail('Esse arquivo não é um backup válido.')}
  const okFormato=d&&typeof d==='object'&&d.config&&Array.isArray(d.config.categorias)&&d.months&&typeof d.months==='object'&&!Array.isArray(d.months)&&Object.keys(d.months).every(k=>/^\d{4}-\d{2}$/.test(k)&&Array.isArray(d.months[k]));
  if(!okFormato)return fail('Esse arquivo não é um backup do app Finanças.');
  const nNovo=contarLanc(d.months),nAtual=contarLanc(S.months);
  const quando=d.exportado&&!isNaN(Date.parse(d.exportado))?' (exportado em '+fmtDataHora(Date.parse(d.exportado))+')':'';
  const sim=await confirmar({titulo:'Substituir os dados deste aparelho?',texto:'Os dados atuais ('+nAtual+' '+(nAtual===1?'lançamento':'lançamentos')+') serão trocados pelos do backup'+quando+': '+nNovo+' '+(nNovo===1?'lançamento':'lançamentos')+' e '+d.config.categorias.length+' categorias. Isso não pode ser desfeito.',botao:'Substituir dados'});
  if(!sim)return;
  S.config=novoConfig(d.config);
  const M={};for(const k in d.months)if(d.months[k].length)M[k]=d.months[k];
  S.months=M;store.saveLocal();
  if(d.comprovantes&&typeof d.comprovantes==='object'){
    try{await IDB.limpar();for(const k in d.comprovantes){const u=d.comprovantes[k];if(typeof u==='string'&&u.indexOf('data:image/')===0)await IDB.put(k,await (await fetch(u)).blob())}}catch(e){}
  }
  closeModal();render();toast('Backup importado: '+nNovo+' lançamentos');
}

/* ---------- calculadora ---------- */
let calcKey=null;
function calcAvaliar(str){
  const toks=[];let i=0;
  while(i<str.length){
    const c=str[i];
    if(/[0-9,]/.test(c)){let j=i;while(j<str.length&&/[0-9,]/.test(str[j]))j++;const t=str.slice(i,j);if((t.match(/,/g)||[]).length>1)return null;const n=Number(t.replace(',','.'));if(isNaN(n))return null;toks.push({n});i=j}
    else{toks.push({o:c});i++}
  }
  let p=0;
  const fator=()=>{
    let neg=false;if(toks[p]&&toks[p].o==='−'){neg=true;p++}
    const t=toks[p];if(!t||t.n===undefined)return null;p++;
    let pct=false;if(toks[p]&&toks[p].o==='%'){pct=true;p++}
    return {v:neg?-t.n:t.n,pct};
  };
  const termo=()=>{
    const f=fator();if(!f)return null;
    let v=f.pct?f.v/100:f.v,ops=0;
    while(toks[p]&&(toks[p].o==='×'||toks[p].o==='÷')){
      const o=toks[p].o;p++;const g=fator();if(!g)return null;
      const gv=g.pct?g.v/100:g.v;v=o==='×'?v*gv:v/gv;ops++;
    }
    return {v,pct:ops===0&&f.pct?f.v:null};
  };
  const t0=termo();if(!t0)return null;let v=t0.v;
  while(toks[p]&&(toks[p].o==='+'||toks[p].o==='−')){
    const o=toks[p].o;p++;const u=termo();if(!u)return null;
    const uv=u.pct!==null?v*u.pct/100:u.v;v=o==='+'?v+uv:v-uv;
  }
  if(p!==toks.length||!isFinite(v))return null;
  return Math.round(v*1e8)/1e8;
}
const numCalc=v=>{const r=Math.round(Math.abs(v)*100)/100;return (v<0?'−':'')+String(r).replace('.',',')};
function abrirCalc(inp){
  fecharCalc();
  const ini=parseValor(inp.value);
  let ex=ini>0?numCalc(ini):'',novo=ini>0;
  const root=$('#calc-root');
  root.innerHTML='<div class="ov" data-ov><div class="sheet calc" role="dialog" aria-modal="true" aria-labelledby="calc-t" tabindex="-1">'+
    '<div class="sheet-h"><h2 id="calc-t">Calculadora</h2><button type="button" class="x" data-fechar aria-label="Fechar calculadora">'+ic.x+'</button></div>'+
    '<div class="calc-tela"><p class="calc-expr" data-ex aria-live="polite"></p><p class="calc-res" data-res></p></div>'+
    '<div class="calc-teclas">'+
      [['C','fn'],['⌫','fn'],['%','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],[','],['=','igual']]
      .map(([k,c])=>'<button type="button" data-k="'+k+'"'+(c?' class="'+c+'"':'')+' aria-label="'+({'C':'Limpar','⌫':'Apagar','%':'Porcento','÷':'Dividir','×':'Multiplicar','−':'Menos','+':'Mais','=':'Igual',',':'Vírgula'}[k]||k)+'">'+k+'</button>').join('')+
    '</div><p class="erro" role="alert" hidden></p>'+
    '<button type="button" class="btn calc-usar" data-usar>Usar valor</button></div></div>';
  root.hidden=false;
  const sheet=root.querySelector('.calc'),exEl=sheet.querySelector('[data-ex]'),resEl=sheet.querySelector('[data-res]'),err=sheet.querySelector('.erro'),usar=sheet.querySelector('[data-usar]');
  const limpo=()=>ex.replace(/[+−×÷,]+$/,'');
  const atual=()=>{const t=limpo();return t?calcAvaliar(t):null};
  const desenhar=()=>{
    err.hidden=true;
    exEl.textContent=ex?ex.replace(/([+×÷])/g,' $1 ').replace(/(\d|%)−/g,'$1 − '):'0';
    const r=atual();
    resEl.textContent=r===null?(ex&&/÷0(?![0-9,])/.test(limpo())?'Não dá para dividir por zero':''):'= '+money(r);
    usar.textContent=r!==null&&r>0?'Usar '+money(r):'Usar valor';
  };
  const ehOp=c=>'+−×÷'.indexOf(c)>=0;
  const tecla=k=>{
    const ult=ex.slice(-1);
    if(/^[0-9]$/.test(k)){
      if(novo){ex='';novo=false}
      if(ult==='%')ex+='×';
      const m=ex.match(/[0-9,]*$/)[0];
      if(m==='0')ex=ex.slice(0,-1);
      ex+=k;
    }else if(k===','){
      if(novo){ex='';novo=false}
      const m=ex.match(/[0-9,]*$/)[0];
      if(m.indexOf(',')>=0)return;
      if(ult==='%')ex+='×';
      ex+=m===''?'0,':',';
    }else if(ehOp(k)){
      novo=false;
      if(!ex){if(k==='−')ex='−';return desenhar()}
      if(ex==='−')return;
      if(ult===',')ex=ex.slice(0,-1);
      if(ehOp(ex.slice(-1))){if(k==='−'&&(ex.slice(-1)==='×'||ex.slice(-1)==='÷'))ex+='−';else ex=ex.replace(/[+−×÷]+$/,'')+k}
      else ex+=k;
    }else if(k==='%'){
      novo=false;
      if(/[0-9]$/.test(ex))ex+='%';
    }else if(k==='⌫'){novo=false;ex=ex.slice(0,-1)}
    else if(k==='C'){ex='';novo=false}
    else if(k==='='){
      const r=atual();if(r===null){if(ex)err.textContent='Conta incompleta.',err.hidden=false;return}
      ex=numCalc(r);novo=true;
    }
    desenhar();
  };
  sheet.querySelector('.calc-teclas').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)tecla(b.dataset.k)});
  sheet.querySelector('[data-fechar]').addEventListener('click',()=>{fecharCalc();inp.focus({preventScroll:true})});
  root.querySelector('[data-ov]').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharCalc()});
  usar.addEventListener('click',()=>{
    const r=atual();
    if(r===null){err.textContent='Termine a conta antes de usar o valor.';err.hidden=false;return}
    if(!(r>0)){err.textContent='O valor precisa ser maior que zero.';err.hidden=false;return}
    inp.value=valorInput(Math.round(r*100)/100);
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    fecharCalc();inp.focus({preventScroll:true});
  });
  calcKey=e=>{
    const map={'*':'×','x':'×','X':'×','/':'÷','-':'−','+':'+','%':'%',',':',','.':',','Enter':'=','=':'=','Backspace':'⌫','Delete':'C','c':'C','C':'C'};
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();fecharCalc();inp.focus({preventScroll:true});return}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=/^[0-9]$/.test(e.key)?e.key:map[e.key];
    if(!k)return;
    if(e.key==='Enter'&&document.activeElement&&document.activeElement.matches&&document.activeElement.matches('[data-usar],[data-fechar]'))return;
    e.preventDefault();e.stopPropagation();tecla(k);
  };
  document.addEventListener('keydown',calcKey,true);
  desenhar();sheet.focus({preventScroll:true});
}
function fecharCalc(){
  const root=$('#calc-root');if(!root||root.hidden)return;
  if(calcKey){document.removeEventListener('keydown',calcKey,true);calcKey=null}
  root.hidden=true;root.innerHTML='';
}
