<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="description" content="Controle financeiro pessoal: despesas, receitas, checklist de contas e metas.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="tc" content="#070B0E">
<script>
(function(){var p='escuro';try{p=localStorage.getItem('financas-tema')||'escuro'}catch(e){}
var t=p==='claro'?'light':p==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B0E;--surface:#0E161B;--surface-2:#121D23;--ink:#E9F2F3;--muted:#8D9EA6;--line:#1C2830;--soft:#15212A;
  --accent:#3DE0B0;--accent-ink:#032A1F;--accent-2:#46B5FF;
  --pos:#3DDC97;--pos-ink:#03281B;--neg:#FF6B6B;--save:#8AA8FF;--warn:#FFC24B;
  --bar-pos:#36A06F;--bar-neg:#D66049;--bar-mag:#2FB58D;
  --glow:rgba(61,224,176,.16);--glow-2:rgba(70,181,255,.12);--sombra:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F2F5F7;--surface:#FFFFFF;--surface-2:#F7F9FA;--ink:#0B1A20;--muted:#56666D;--line:#DAE2E6;--soft:#E8EEF1;
  --accent:#0B8A64;--accent-ink:#FFFFFF;--accent-2:#1F7FD1;
  --pos:#12825A;--pos-ink:#FFFFFF;--neg:#C8443C;--save:#3B5BA5;--warn:#9E6D06;
  --bar-pos:#1E7A54;--bar-neg:#B5432E;--bar-mag:#1E8C6B;
  --glow:rgba(11,138,100,.10);--glow-2:rgba(31,127,209,.08);--sombra:0 8px 24px rgba(16,40,50,.10);
  color-scheme:light;
}
/* faixa da barra de status do iPhone sempre escura no tema claro (o texto dela é branco) */
@media (display-mode: standalone){:root[data-theme="light"] body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#070B0E;z-index:40}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* estrutura */
.app{min-height:100vh}
.side{display:none}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:10px;min-height:60px}
.mes{display:flex;align-items:center;gap:2px;margin-right:auto}
.mes-l{font-weight:700;font-size:1.05rem;min-width:132px;text-align:center;letter-spacing:-.01em}
.ic-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ic-btn:hover{background:var(--soft)}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .navb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 1px 4px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs .navb[aria-current="page"]{color:var(--ink)}
.tabs .navb[aria-current="page"]::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(10,30,28,.25)}
.fab svg{width:28px;height:28px}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:26px 16px 20px;border-right:1px solid var(--line)}
  .brand{font-weight:800;font-size:1.35rem;letter-spacing:-.03em;padding:0 10px 14px}
  .side .btn{margin:0 4px 14px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:12px 14px}
  .side .navb,.side-link{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left;width:100%}
  .side .navb:hover,.side-link:hover{background:var(--soft);color:var(--ink)}
  .side .navb[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  .side-pe{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .sync{font-size:.8rem;color:var(--muted);padding:0 12px}
  .tabs,.fab,.m-only{display:none!important}
  main{padding-bottom:56px}
  .top-in{min-height:72px}
}

/* tipografia de seções */
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 16px}
.vh h1{font-size:1.65rem;font-weight:800;letter-spacing:-.025em}
.bloco{margin-top:28px}
.bloco-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.bloco-h h2{font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
.dica{color:var(--muted);font-size:.88rem}
.dica.topo{margin-top:20px}
.nada{color:var(--muted);margin-bottom:12px}
.aviso{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:6px 0 4px}
.carregando{color:var(--muted);padding:40px 0}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* hero */
.hero{padding:8px 0 4px}
.hero-l{color:var(--muted);font-size:.95rem}
.hero-v{margin:2px 0 2px;font-size:clamp(2.6rem,11vw,3.7rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-v.neg{color:var(--neg)}
.hero-e{color:var(--muted);font-size:.95rem;margin-bottom:16px}
.regua{position:relative;display:flex;gap:3px;height:22px;border-radius:7px;background:var(--soft);overflow:hidden}
.regua span{height:100%}
.s-desp{background:var(--neg)}.s-apo{background:var(--save)}.s-sobra{background:var(--pos)}
.regua .marca{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.fluxo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.fluxo div{min-width:0}
.fluxo dt{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.fluxo dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{width:10px;height:10px;border-radius:3px;flex:none}
.k-desp{background:var(--neg)}.k-apo{background:var(--save)}.k-sobra{background:var(--pos)}

/* painéis e listas */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.vazio{padding:22px 20px}
.vazio h2{font-size:1.1rem;margin-bottom:6px}
.vazio p{color:var(--muted);margin-bottom:14px}
.vazio p:last-child{margin-bottom:0}
.lista{list-style:none;margin:0;padding:0}
.lista>li+li{border-top:1px solid var(--line)}
.linha{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 4px}
.linha-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px 8px;text-align:left;cursor:pointer;border-radius:10px}
.linha-main.estatico{cursor:default}
button.linha-main:hover{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.txt{display:flex;flex-direction:column;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:.84rem;color:var(--muted)}
.val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.val small{font-weight:500;color:var(--muted);font-size:.84rem}
.val.v-receita{color:var(--pos)}.val.v-aporte{color:var(--save)}
.tx{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer}
.tx:hover{background:var(--soft)}
.lista>li:first-child .tx{border-radius:var(--radius) var(--radius) 0 0}
.lista>li:last-child .tx{border-radius:0 0 var(--radius) var(--radius)}
.lista>li:only-child .tx{border-radius:var(--radius)}
.tx .txt{flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.pill:hover{border-color:var(--ink)}
.pill.pago{background:var(--soft);color:var(--pos);border-color:transparent;padding:7px 9px}
.pill svg{width:16px;height:16px}
.st{font-style:normal;font-weight:700;margin-left:2px}
.st-atrasada{color:var(--neg)}.st-hoje,.st-breve{color:var(--warn)}
.mais{color:var(--muted);font-size:.88rem;margin-top:8px}
h3.dia{font-size:.86rem;color:var(--muted);font-weight:600;margin:20px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 15px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* barras e orçamento */
.barra{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.barra>span{display:block;height:100%;background:var(--pos);border-radius:4px}
.barra.alerta>span{background:var(--accent)}
.barra.estouro>span{background:var(--neg)}
.barra.b-meta>span{background:var(--save)}
.orc-btn{display:block;width:100%;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.orc-btn:hover{background:var(--soft)}
.lista>li:first-child .orc-btn{border-radius:var(--radius) var(--radius) 0 0}
.lista>li:last-child .orc-btn{border-radius:0 0 var(--radius) var(--radius)}
.lista>li:only-child .orc-btn{border-radius:var(--radius)}
.orc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.nome{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orc-bot{display:flex;justify-content:space-between;margin-top:6px;font-size:.84rem;color:var(--muted)}
.orc-tot{padding:4px 0 6px}
.orc-v{font-size:1.15rem;margin:4px 0 12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.orc-v strong{font-size:2rem;color:var(--ink);font-weight:800;letter-spacing:-.03em}
.orc-tot .barra{height:12px;border-radius:6px}
.orc-msg{margin-top:10px;font-weight:600}
.placar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.placar div{display:flex;flex-direction:column}
.placar span{font-size:.86rem;color:var(--muted)}
.placar strong{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* metas */
.metas{display:flex;flex-direction:column;gap:14px}
.meta{padding:16px 16px 18px}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta-top h2{font-size:1.1rem}
.meta-v{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.meta-v small{font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0}
.meta-txt{color:var(--muted);font-size:.9rem;margin-top:10px}
.meta-acoes{display:flex;gap:10px;margin-top:14px}
.meta-acoes>*{flex:1}

/* botões */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.05)}
.btn-sec{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-sec:hover{border-color:var(--ink)}
.btn-sec svg,.btn svg{width:18px;height:18px}
.btn-perigo{background:transparent;color:var(--neg);border:0;padding:12px 6px;font-weight:700;cursor:pointer;margin-right:auto}
.btn-perigo-cheio{background:var(--neg);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;cursor:pointer;padding:4px 0;font-weight:600}
.link-mes{font-size:.86rem;white-space:nowrap}

/* modais */
#modal-root,#confirm-root{position:fixed;inset:0;z-index:50}
#confirm-root{z-index:60}
.ov{position:absolute;inset:0;background:rgba(6,18,17,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out;overscroll-behavior:contain}
@media (min-width:640px){.ov{align-items:center;padding:24px}.sheet{max-width:500px;border-radius:20px;padding-bottom:22px}}
.sheet-c{max-width:420px}
.sheet-c h2{font-size:1.2rem;margin-bottom:8px}
.sheet-c p{color:var(--muted);margin-bottom:18px}
@keyframes sobe{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font-size:1.25rem;letter-spacing:-.01em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.form{display:flex;flex-direction:column;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:600;min-width:0}
.campo small{font-weight:500}
.campo input,.campo select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-weight:500;-webkit-appearance:none;appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.campo input[type="date"]{min-height:46px}
.moeda{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding-left:12px}
.moeda i{font-style:normal;color:var(--muted);font-weight:700}
.campo .moeda input{border:0;background:transparent;font-size:1.35rem;font-weight:700;padding:9px 12px 9px 8px}
.campo .moeda input:focus-visible{outline:none}
.moeda:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:0;padding:3px;margin:0;background:var(--soft);border-radius:12px;min-width:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--muted);font-size:.95rem}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.cores{display:flex;flex-wrap:wrap;gap:10px;border:0;padding:0;margin:0}
.cores legend{font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:8px;padding:0}
.cores label{position:relative}
.cores input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.cores span{display:block;width:34px;height:34px;border-radius:50%}
.cores input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cores input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.acoes{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:4px}
.acoes .btn,.acoes .btn-perigo-cheio{flex:1}
@media (min-width:640px){.acoes .btn,.acoes .btn-perigo-cheio{flex:none}}
.erro{color:var(--neg);font-weight:600;font-size:.92rem}
.cat-h{font-size:.95rem;font-weight:700;margin:6px 0 -4px}
.cat-l .linha{padding:4px 4px 4px 12px}
.cat-l .t1{flex:1}

/* despesas x receitas */
.escolha{display:grid;gap:10px}
.esc{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.esc:hover{border-color:var(--ink)}
.esc svg{width:24px;height:24px;flex:none;padding:8px;box-sizing:content-box;border-radius:50%;color:#fff}
.esc-desp svg{background:var(--neg)}.esc-rec svg{background:var(--pos)}
.esc strong{display:block;font-size:1.08rem}
.esc small{color:var(--muted);font-size:.88rem}
.lados{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px}
.lado{border:0;background:none;padding:12px 8px;border-radius:11px;font-weight:700;font-size:1rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.lado[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lado-tot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 6px}
.lado-tot div{display:flex;flex-direction:column;min-width:0}
.lado-tot span{font-size:.88rem;color:var(--muted)}
.lado-tot strong{font-size:clamp(1.4rem,6vw,1.7rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lado-tot strong.neg{color:var(--neg)}
.lado-tot .btn-sec{white-space:nowrap;flex:none}
.side .novos{display:flex;flex-direction:column;gap:8px;margin:0 4px 16px}
.side .novos .btn{margin:0}
.btn-rec{background:var(--pos);color:#fff}
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.hist-h{font-size:.86rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.hist .tx{padding:10px 2px}
.hist .link{margin-top:6px}

/* categorias no Dia a dia */
.cats-strip{margin:16px 0 4px}
.cats-h{font-size:.86rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.cats-l{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cat-chip{white-space:nowrap;flex:none}
.cat-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer}
.cat-chip:hover{border-color:var(--ink)}
.cat-add{border-style:dashed;background:transparent}
.cat-add svg{width:16px;height:16px}
.cats-strip .dica{margin-top:8px}

/* data discreta */
.data-linha{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem}
.data-linha strong{color:var(--ink);font-weight:600}
.data-linha .link{padding:2px 0}

/* checklist */
.chk-res{padding:4px 0 14px}
.chk-res .orc-v{margin:4px 0 10px}
.chk-res .barra{height:12px;border-radius:6px}
.chk-res .dica{margin-top:8px}
.chk-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.chk-item:hover{background:var(--soft)}
.lista>li:first-child .chk-item{border-radius:var(--radius) var(--radius) 0 0}
.lista>li:last-child .chk-item{border-radius:0 0 var(--radius) var(--radius)}
.lista>li:only-child .chk-item{border-radius:var(--radius)}
.chk-item .txt{flex:1}
.chk-box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;background:var(--surface)}
.chk-box svg{width:18px;height:18px;stroke-width:3}
.feito .chk-box,.chk-box.ok{background:var(--pos);border-color:var(--pos)}
.feito .t1{color:var(--muted)}
.feito .t2{color:var(--pos);font-weight:600}
.comp-bts{display:flex;gap:18px}

/* campo pago */
.tx-l{display:flex;align-items:center}
.tx-l .tx{flex:1;min-width:0;padding-left:6px}
.chk-mini{background:none;border:0;padding:12px 4px 12px 14px;cursor:pointer;display:grid;place-items:center}
.chk-mini .chk-box{width:26px;height:26px;border-radius:8px}
.chk-mini.ok .chk-box{background:var(--pos);border-color:var(--pos)}
.st-pg{font-weight:700;color:var(--warn)}
.st-pg.ok{color:var(--pos)}
.pago-campo{display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer;position:relative;padding:4px 0}
.pago-campo input{position:absolute;left:0;opacity:0;width:28px;height:28px;margin:0;cursor:pointer}
.pago-campo .chk-box{color:transparent}
.pago-campo input:checked+.chk-box{background:var(--pos);border-color:var(--pos);color:#fff}
.pago-campo input:focus-visible+.chk-box{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:899px){
  .top-in{gap:2px}
  .mes{gap:0}
  .mes .ic-btn{width:34px}
  .mes-l{min-width:0;padding:0 4px;font-size:1rem}
  .link-mes{font-size:.8rem;margin-right:2px}
}
@media (max-width:379px){
  .mes-l{font-size:.9rem;white-space:nowrap}
  .link-mes{font-size:.74rem}
  .top-in .ic-btn{width:36px}
}
/* ---------- visual tech ---------- */
body{font-feature-settings:"tnum" 1}
.top{background:var(--bg);background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.tabs{background:var(--surface);background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.tabs .navb[aria-current="page"]{color:var(--accent)}
.tabs .navb[aria-current="page"]::before{background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--glow)}
.side .navb[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent);color:var(--ink)}
.painel{background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.btn{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));box-shadow:0 6px 18px var(--glow)}
.btn-rec{background:var(--pos);color:var(--pos-ink)}
.fab{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 10px 30px var(--glow),0 0 0 1px rgba(255,255,255,.08) inset}
.hero{position:relative;margin-top:14px;padding:20px 18px 18px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(130% 120% at 0% 0%,var(--glow),transparent 55%),radial-gradient(120% 120% at 100% 100%,var(--glow-2),transparent 55%),var(--surface);box-shadow:var(--sombra)}
.hero .fluxo{margin-top:14px}
.card-tech{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--surface)}
.sheet{background:var(--surface);border:1px solid var(--line)}
.esc{background:var(--surface-2)}

/* entrada da tela */
@keyframes surge{from{opacity:0;transform:translateY(10px)}}
@keyframes cresce{from{transform:scaleX(0)}}
@keyframes sobe{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:no-preference){
  .entrada .hero,.entrada .vh,.entrada .bloco,.entrada .card-tech,.entrada .pl-hero{animation:surge .5s cubic-bezier(.2,.7,.2,1) both}
  .entrada .bloco:nth-child(3){animation-delay:.05s}.entrada .bloco:nth-child(4){animation-delay:.1s}.entrada .bloco:nth-child(5){animation-delay:.15s}.entrada .bloco:nth-child(6){animation-delay:.2s}
  .entrada .barra>span,.entrada .rk-bar i,.entrada .regua span{animation:cresce .8s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
  .entrada .g6-col i,.entrada .pl-area.cima i{animation:sobe .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom}
  .entrada .pl-area.baixo i{animation:sobe .7s cubic-bezier(.2,.7,.2,1) both;transform-origin:top}
}

/* disponível para gastar */
.disp-l{color:var(--muted);font-size:.95rem}
.disp-v{font-size:clamp(2rem,9vw,2.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:2px 0 4px;color:var(--accent)}
.disp-v.neg{color:var(--neg)}
.disp-e{font-weight:600}
.disp-dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.disp-dl div{min-width:0}
.disp-dl dt{font-size:.78rem;color:var(--muted)}
.disp-dl dd{margin:2px 0 0;font-weight:700;font-size:clamp(.78rem,3.4vw,.95rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp .dica{margin-top:10px}

/* ranking de gastos */
.rk li{padding:12px 16px}
.rk-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.rk-bar{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--bar-mag),var(--accent))}

/* últimos 6 meses */
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;margin-top:6px}
.g6-col{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;border:0;background:none;padding:6px 0 0;cursor:pointer;border-radius:10px}
.g6-col:hover,.g6-col[aria-pressed="true"]{background:var(--soft)}
.g6-col i{display:block;width:34%;max-width:20px;border-radius:4px 4px 0 0;min-height:2px}
.g6-col .r{background:var(--bar-pos)}.g6-col .d{background:var(--bar-neg)}
.g6-rot{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;text-align:center;font-size:.72rem;color:var(--muted);margin-top:6px}
.g6-leg{display:flex;gap:16px;font-size:.84rem;color:var(--muted);margin-top:10px}
.g6-leg span{display:inline-flex;align-items:center;gap:6px}
.g6-leg b{width:10px;height:10px;border-radius:3px;display:inline-block}
.g6-info{margin-top:8px;font-weight:600;font-size:.92rem;min-height:1.4em}

/* central de lançamento */
.voz-cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);background:radial-gradient(120% 140% at 0% 0%,var(--glow),transparent 60%),var(--surface-2)}
.voz-cta:hover{border-color:var(--accent)}
.voz-cta .mic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.voz-cta strong{display:block;font-size:1.05rem}
.voz-cta small{color:var(--muted);font-size:.86rem}
.rap-h{font-size:.86rem;color:var(--muted);font-weight:600;margin:4px 0 -4px}
.rap-l{display:flex;flex-wrap:wrap;gap:8px}
.rap-l .cat-chip{background:var(--surface-2)}
.rep-btn{display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;text-align:left}
.rep-btn small{color:var(--muted);font-weight:500}

/* voz */
.voz{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 4px}
.voz-mic{position:relative;width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 34px var(--glow)}
.voz-mic svg{width:38px;height:38px}
.voz-mic::before,.voz-mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.voz-mic.ouvindo::before{animation:onda 1.4s ease-out infinite}
.voz-mic.ouvindo::after{animation:onda 1.4s ease-out .7s infinite}
@keyframes onda{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.voz-mic.ouvindo::before{animation:none;opacity:.6}.voz-mic.ouvindo::after{animation:none}}
.voz-st{text-align:center;color:var(--muted);min-height:2.6em;max-width:320px}
.voz-st q{color:var(--ink);font-weight:600}
.voz-prev{display:flex;flex-wrap:wrap;gap:8px}
.voz-prev span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.voz-prev .t-receita{color:var(--pos)}.voz-prev .t-despesa{color:var(--neg)}
.voz-prev .falta{color:var(--muted);border-style:dashed}

/* ferramentas */
.fer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.fer-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fer{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 50%),var(--surface);text-align:left;cursor:pointer;min-height:150px;color:var(--ink);min-width:0}
.fer:hover{border-color:var(--accent)}
.fer .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.fer .fi svg{width:21px;height:21px}
.fer strong{font-size:1rem;line-height:1.2}
.fer small{color:var(--muted);font-size:.82rem;line-height:1.3}
.fer .fs{margin-top:auto;font-weight:700;font-size:.88rem;color:var(--accent)}
.voltar{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:8px 0 0;font-size:.92rem}
.voltar svg{width:18px;height:18px}
.voltar:hover{color:var(--ink)}
.ferr-h{margin:2px 0 14px}
.ferr-h p{color:var(--muted);margin-top:4px}

/* busca */
.bs-campo{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px}
.bs-campo:focus-within{border-color:var(--accent)}
.bs-campo svg{width:20px;height:20px;color:var(--muted);flex:none}
.bs-campo input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1rem;padding:10px 0;outline:none}
.bs-fil{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.bs-fil select,.bs-fil input{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.bs-res-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 0}
.bs-res-h strong{font-size:1.05rem}

/* comparativo */
.cp-sel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-bottom:14px}
.cp-sel select{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;-webkit-appearance:none;appearance:none;text-align:center}
.cp-sel span{color:var(--muted);font-weight:700}
.cp-tot{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0}
.cp-tot div{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;padding:12px 16px;min-width:0}
.cp-tot div+div{border-top:1px solid var(--line)}
.cp-tot .delta{grid-column:2;text-align:right;font-size:.8rem}
.cp-top .nome{min-width:0}
.cp-tot dt{font-size:.9rem;color:var(--muted);grid-row:span 2;align-self:center}
.cp-tot dd{margin:0;font-weight:800;font-size:1rem;white-space:nowrap;text-align:right}
.cp-l{padding:12px 16px}
.cp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cp-vals{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted);margin-top:6px}
.cp-bars{display:grid;gap:3px;margin-top:8px}
.cp-bars i{display:block;height:6px;border-radius:3px;min-width:2px}
.cp-bars .a{background:var(--accent)}.cp-bars .b{background:var(--muted);opacity:.55}
.delta{font-weight:800;font-size:.86rem;white-space:nowrap}
.delta.ruim{color:var(--neg)}.delta.bom{color:var(--pos)}.delta.neutro{color:var(--muted)}
.cp-leg{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:6px 0 10px}
.cp-leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* análises */
.ins{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.ins-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--soft)}
.ins-ic svg{width:18px;height:18px}
.ins.alerta .ins-ic{color:var(--neg)}.ins.atencao .ins-ic{color:var(--warn)}.ins.positivo .ins-ic{color:var(--pos)}.ins.info .ins-ic{color:var(--accent-2)}
.ins strong{display:block;line-height:1.3}
.ins p{color:var(--muted);font-size:.9rem;margin-top:2px}
.ins-tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ins.alerta .ins-tag{color:var(--neg)}.ins.atencao .ins-tag{color:var(--warn)}.ins.positivo .ins-tag{color:var(--pos)}.ins.info .ins-tag{color:var(--accent-2)}

/* saúde */
.gauge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 0}
.gauge svg{width:min(300px,86%);height:auto;overflow:visible}
.gauge .gv{font-size:3rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:-62px}
.gauge .gl{font-weight:700;margin-top:6px}
.gauge .gd{color:var(--muted);font-size:.86rem;text-align:center;max-width:320px;margin-top:4px}
.sd-l{padding:12px 16px}
.sd-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.sd-top b{font-weight:800}
.sd-l p{color:var(--muted);font-size:.86rem;margin-top:6px}

/* reserva */
.rs-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rs-ring{width:116px;height:116px}
.rs-ring text{font:800 22px 'Schibsted Grotesk',system-ui,sans-serif;fill:var(--ink)}
.rs-dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rs-dl dt{font-size:.8rem;color:var(--muted)}
.rs-dl dd{margin:2px 0 0;font-weight:800;font-size:1.05rem}

/* cartões */
.cc{position:relative;border-radius:20px;padding:18px;color:#fff;min-height:150px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:var(--sombra);border:0;text-align:left;cursor:pointer;width:100%}
.cc::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .cc-n{font-weight:800;font-size:1.1rem;position:relative}
.cc .cc-s{opacity:.85;font-size:.86rem;position:relative}
.cc .cc-v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-top:auto;position:relative}
.cc .cc-b{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.cc .cc-b i{display:block;height:100%;background:#fff;border-radius:3px}
.cc-lista{display:grid;gap:14px}
.fat-st{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
.fat-st.aberta{color:var(--accent-2)}.fat-st.fechada{color:var(--warn)}.fat-st.paga{color:var(--pos)}.fat-st.atrasada{color:var(--neg)}
.parc-prev{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.parc-prev strong{color:var(--accent)}
.cc-ic{display:inline-grid;place-items:center;width:26px;height:26px;color:var(--muted)}
.cc-ic svg{width:18px;height:18px}

/* dívidas */
.dv{padding:16px}
.dv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dv-top h3{font-size:1.05rem}
.dv-num{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.dv-num small{font-size:.9rem;color:var(--muted);font-weight:600;letter-spacing:0}
.dv-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px}
.dv-dl dt{font-size:.78rem;color:var(--muted)}
.dv-dl dd{margin:1px 0 0;font-weight:700}
.dv-sim{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dv-sim .moeda{max-width:220px}
.dv-res{margin-top:8px;font-weight:600}
.dv-res b{color:var(--pos)}
.dv-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* fluxo de caixa */
.fx-saldo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fx-saldo strong{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;display:block}
.fx-alerta{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;margin-top:14px;border:1px solid var(--line);background:var(--surface)}
.fx-alerta.ruim{border-color:color-mix(in srgb,var(--neg) 55%,var(--line))}
.fx-alerta svg{width:22px;height:22px;flex:none;margin-top:2px}
.fx-alerta.ruim svg{color:var(--neg)}.fx-alerta.bom svg{color:var(--pos)}
.fx-alerta.meio{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.fx-alerta.meio svg{color:var(--warn)}
.sm-form{padding:16px;display:grid;gap:14px}
.sm-resumo{margin:10px 2px 0;color:var(--muted);font-weight:600;font-size:.92rem}
.sm-box{padding:14px 12px 12px}
.sm-graf{position:relative;display:grid;gap:4px;height:170px}
.sm-zero{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--muted);opacity:.7;pointer-events:none;z-index:1}
.sm-col{position:relative;border:0;background:none;padding:0;border-radius:8px;cursor:pointer;min-width:0;height:100%}
.sm-col:hover,.sm-col[aria-pressed="true"]{background:var(--soft)}
.sm-col i{position:absolute;width:30%;max-width:14px;min-height:2px}
.sm-col .a{right:calc(50% + 1px);background:var(--muted);opacity:.5}
.sm-col .b{left:calc(50% + 1px);background:var(--bar-mag)}
.sm-col .up{border-radius:4px 4px 0 0}.sm-col .dn{border-radius:0 0 4px 4px}
.sm-rot{display:grid;gap:4px;text-align:center;font-size:.7rem;color:var(--muted);margin-top:6px}
.sm-rot .neg{color:var(--neg);font-weight:800}
.sm-ex .ins p{margin:0}
.sm-lancar{margin-top:16px}
.pdf-prev{display:flex;gap:14px;align-items:flex-start;padding:18px}

/* ---------- armazenamento ---------- */
const store={
  col:null,pending:{},queued:{},chains:{},assets:null,sample:null,imgOK:false,sampleOff:false,
  async init(){
    try{
      const c=window.claude;
      if(c&&typeof c.use==='function'){
        c.use('assets').then(a=>{this.assets=a||null;if(S.ready)render()}).catch(()=>{});
        c.use('sample').then(async sm=>{this.sample=sm||null;if(sm){const L=await sm.limits().catch(()=>null);this.imgOK=!!(L&&L.images)}if(S.ready)render()}).catch(()=>{});
        const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
        const id=user?await user.id():null;
        if(db&&id){this.col=db.collection('data/users/'+id);S.mode='sync';render();this.subscribe();return}
      }
    }catch(e){}
    this.local();
  },
  subscribe(){
    this.col.onSnapshot(snap=>{
      let config=null;const months={};
      for(const d of snap.docs){
        const data=d.data();if(!data)continue;
        if(d.id==='config')config=clone(data);
        else if(d.id.indexOf('m-')===0)months[d.id.slice(2)]=Array.isArray(data.lanc)?clone(data.lanc):[];
      }
      if(!this.pending.config)S.config=novoConfig(config);
      const keys=new Set(Object.keys(months).concat(Object.keys(S.months)));
      keys.forEach(ym=>{if(this.pending['m-'+ym])return;if(months[ym]&&months[ym].length)S.months[ym]=months[ym];else delete S.months[ym]});
      S.ready=true;render();
    },err=>{
      S.ready=true;render();
      toast(err&&err.code==='revoked'?'O acesso aos dados foi encerrado nesta visualização.':'A sincronização parou. Recarregue a página para retomar.');
    });
  },
  local(){
    S.mode='local';
    try{const raw=localStorage.getItem(LKEY);if(raw){const d=JSON.parse(raw);S.config=novoConfig(d.config);S.months=d.months||{}}}catch(e){}
    S.ready=true;render();
  },
  saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({config:S.config,months:S.months}))}catch(e){toast('Não foi possível salvar neste aparelho. Exporte um backup.')}},
  write(key){
    if(S.mode!=='sync'){this.saveLocal();return}
    if(this.queued[key])return;
    this.queued[key]=true;
    this.pending[key]=(this.pending[key]||0)+1;
    const run=async()=>{
      this.queued[key]=false;
      const ref=this.col.doc(key);
      const op=()=>{
        if(key==='config')return ref.set(clone(S.config));
        const L=S.months[key.slice(2)]||[];
        return L.length?ref.set({lanc:clone(L)}):ref.delete();
      };
      try{await op()}
      catch(e){
        if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await op()}catch(e2){falhaEscrita(e2)}}
        else falhaEscrita(e);
      }finally{
        this.pending[key]--;if(this.pending[key]<=0)delete this.pending[key];
      }
    };
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(run);
  }
};
function falhaEscrita(e){
  const c=e&&e.code;
  toast(c==='quota_exceeded'?'O espaço de armazenamento do app está cheio. Exclua lançamentos antigos para continuar.':
        c==='invalid_argument'?'Esta alteração não pôde ser salva.':
        'Não foi possível salvar agora. Confira sua conexão e tente de novo.');
}

function findTxYm(id){for(const ym in S.months){const t=S.months[ym].find(x=>x.id===id);if(t)return {tx:t,ym}}return null}

function gastoCat(ym){const g={};for(const t of lancs(ym))if(t.tipo==='despesa'){const k=catById(t.catId)?t.catId:'_sem';g[k]=(g[k]||0)+t.valor}return g}
function statusConta(c,ym){
  if(c.paga)return'paga';const cur=ymHoje();
  if(ym<cur)return'atrasada';if(ym>cur)return'futura';
  const d=new Date().getDate();
  if(c.diaR<d)return'atrasada';if(c.diaR===d)return'hoje';if(c.diaR-d<=3)return'breve';return'pendente';
}
function pagosIndex(){const idx={};for(const ym in S.months)for(const t of S.months[ym])if(t.contaId)idx[t.contaId+'|'+(t.ref||ym)]={tx:t,ym};return idx}
function contasMes(ym,idx){

    const d=diffM(c.inicio,ym);if(d<0)return null;
    if(c.tipo==='parcela'&&d>=c.parcelas)return null;
    const p=idx[c.id+'|'+ym],tx=p?p.tx:null;
    const r=Object.assign({},c,{n:d+1,paga:!!tx,txId:tx?tx.id:null,txYm:p?p.ym:null,txValor:tx?tx.valor:null,comp:tx&&tx.comp?tx.comp:null,diaR:Math.min(c.dia,diasNoMes(ym))});
    r.status=statusConta(r,ym);return r;
  }).filter(Boolean).sort((a,b)=>a.diaR-b.diaR);
}

function linhaTx(t){

function disponivel(ym){
  const real=realizado(ym),ids=new Set();let rec=0,desp=0,recP=0,despP=0,temPlano=false;
  for(const c of S.config.categorias){
    ids.add(c.id);const p=planoVal(ym,c.id),l=real[c.id]||0;if(p!=null)temPlano=true;
    const v=Math.max(p||0,l);
    if(c.tipo==='receita'){rec+=v;recP+=Math.max(0,(p||0)-l)}else{desp+=v;despP+=Math.max(0,(p||0)-l)}
  }
  let apo=0;
  for(const t of lancs(ym)){
    if(t.tipo==='aporte'){apo+=t.valor;continue}
    if(t.catId&&ids.has(t.catId))continue;
    if(t.tipo==='receita')rec+=t.valor;else if(t.tipo==='despesa')desp+=t.valor;
  }
  return {rec,desp,apo,livre:rec-desp-apo,recP,despP,temPlano};
}
function blocoDisponivel(ym){
  const atual=ymHoje();if(ym<atual)return '';
  const d=disponivel(ym),mes=mesNome(ym);
  if(!d.rec&&!d.desp)return '';
  let porDia='';
  if(ym===atual){
    const hj=Number(hoje().slice(8)),dias=diasNoMes(ym)-hj+1;
    porDia=d.livre>0?'≈ '+money(d.livre/dias)+' por dia nos próximos '+dias+(dias===1?' dia':' dias'):'Os gastos previstos passam do que entra no mês';
  }else porDia=d.livre>=0?'Previsto para '+mes+' de '+ym.slice(0,4):'Previsto: vai faltar dinheiro em '+mes;
  return '<section class="bloco card-tech disp"><p class="disp-l">'+(ym===atual?'Ainda pode gastar em '+mes:'Deve sobrar em '+mes)+'</p>'+
    '<p class="disp-v'+(d.livre<0?' neg':'')+'" data-n="'+d.livre+'">'+money(d.livre)+'</p><p class="disp-e">'+porDia+'</p>'+
    '<dl class="disp-dl"><div><dt>Entra no mês</dt><dd>'+money(d.rec)+'</dd></div><div><dt>Contas e gastos</dt><dd>'+money(d.desp)+'</dd></div><div><dt>Guardado</dt><dd>'+money(d.apo)+'</dd></div></dl>'+
    '<p class="dica">'+(d.temPlano?'Conta com o seu Plano: o que ainda falta pagar ('+money(d.despP)+') já está descontado.':'Sem plano para '+mes+'. <button class="link" data-action="nav" data-view="plano">Preencha o Plano</button> pra essa conta ficar mais certa.')+'</p></section>';
}
function blocoGastos(ym){
  const g={};let tot=0;
  for(const t of lancs(ym))if(t.tipo==='despesa'){const k=catById(t.catId)?t.catId:'_sem';g[k]=(g[k]||0)+t.valor;tot+=t.valor}
  const mes=mesNome(ym);
  if(!tot)return '<section class="bloco"><div class="bloco-h"><h2>Para onde foi o dinheiro</h2></div><p class="nada">Nenhuma despesa lançada em '+mes+'.</p></section>';
  let L=Object.keys(g).map(k=>({k,v:g[k],c:catById(k)})).sort((a,b)=>b.v-a.v);
  if(L.length>7){const resto=L.slice(6).reduce((a,x)=>a+x.v,0);L=L.slice(0,6).concat([{k:'_out',v:resto,c:null,outras:true}])}
  const mx=L[0].v;
  return '<section class="bloco"><div class="bloco-h"><h2>Para onde foi o dinheiro</h2><span class="dica">'+money(tot)+'</span></div><ul class="lista painel rk">'+L.map(x=>{
    const nome=x.outras?'Outras':x.c?x.c.nome:'Sem categoria',cor=x.c?x.c.cor:'var(--muted)',pc=Math.round(x.v/tot*100);
    return '<li><div class="rk-l"><span class="nome"><span class="dot" style="background:'+cor+'"></span>'+esc(nome)+'</span><span class="val">'+money(x.v)+' <small>'+pc+'%</small></span></div><span class="rk-bar" aria-hidden="true"><i style="width:'+(x.v/mx*100).toFixed(1)+'%"></i></span></li>';
  }).join('')+'</ul></section>';
}
function bloco6Meses(ym){
  const M=[];for(let i=5;i>=0;i--)M.push(addM(ym,-i));
  const R=M.map(m=>{const r=resumo(m);return {m,rec:r.rec,desp:r.desp,saldo:r.rec-r.desp}});
  if(!R.some(r=>r.rec||r.desp))return '';
  const mx=Math.max(...R.map(r=>Math.max(r.rec,r.desp)),1);
  const sel=Math.min(5,Math.max(0,S.g6==null?5:S.g6));
  const info=i=>{const r=R[i];return cap(mesNome(r.m))+': entrou '+money(r.rec)+' · saiu '+money(r.desp)+' · '+(r.saldo>=0?'sobrou ':'faltou ')+money(Math.abs(r.saldo))};
  return '<section class="bloco"><div class="bloco-h"><h2>Últimos 6 meses</h2></div><div class="painel card-tech"><div class="g6" role="group" aria-label="Receitas e despesas dos últimos 6 meses">'+R.map((r,i)=>
    '<button class="g6-col" data-action="g6" data-i="'+i+'" aria-pressed="'+(i===sel)+'" aria-label="'+esc(info(i))+'" title="'+esc(info(i))+'"><i class="r" style="height:'+(r.rec/mx*100).toFixed(1)+'%"></i><i class="d" style="height:'+(r.desp/mx*100).toFixed(1)+'%"></i></button>').join('')+
    '</div><div class="g6-rot" aria-hidden="true">'+M.map(m=>'<span>'+cap(MESES_C[Number(m.slice(5))-1])+'</span>').join('')+'</div>'+
    '<div class="g6-leg"><span><b style="background:var(--bar-pos)"></b>Receitas</span><span><b style="background:var(--bar-neg)"></b>Despesas</span></div>'+
    '<p class="g6-info" data-g6info aria-live="polite">'+esc(info(sel))+'</p></div></section>';
}
function vDia(){

  const L=lancs(S.ym).filter(t=>t.tipo===lado).sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0));
  const tot=L.reduce((s,t)=>s+t.valor,0);

    [['despesa','Despesas','neg'],['receita','Receitas','pos']].map(([k,l,c])=>'<button class="lado" data-action="lado" data-l="'+k+'" aria-pressed="'+(lado===k)+'"><span class="dot" style="background:var(--'+c+')"></span>'+l+'</button>').join('')+'</div>';
  const cs=S.config.categorias.filter(c=>c.tipo===lado);
  h+='<div class="cats-strip"><p class="cats-h">Suas categorias de '+(ehD?'despesa':'receita')+'</p><div class="cats-l">'+
    cs.map(c=>'<button class="cat-chip" data-action="cat-chip" data-id="'+c.id+'" aria-label="Editar a categoria '+esc(c.nome)+'"><span class="dot" style="background:'+c.cor+'"></span>'+esc(c.nome)+'</button>').join('')+
    '<button class="cat-chip cat-add" data-action="add-cat" data-t="'+lado+'">'+ic.plus+' Adicionar categoria</button></div>'+
    (cs.length?'':'<p class="dica">Comece criando os nomes, como '+(ehD?'mercado, aluguel ou combustível':'salário ou comissão')+'.</p>')+'</div>';
  h+='<div class="lado-tot"><div><span>'+(ehD?'Despesas':'Receitas')+' de '+mes+(L.length?' ('+L.length+')':'')+'</span><strong class="'+(ehD?'neg':'pos')+'">'+money(tot)+'</strong></div>'+
    '<button class="btn-sec" data-action="'+(ehD?'nova-desp':'nova-rec')+'">'+ic.plus+(ehD?' Nova despesa':' Nova receita')+'</button></div>';
  if(!L.length)return h+'<section class="painel vazio"><p>'+(ehD?'Nenhuma despesa':'Nenhuma receita')+' em '+mes+' ainda.</p></section>';
  if(ehD){const pg=L.filter(isPago).reduce((a,t)=>a+t.valor,0);h+='<p class="dica">Pago: '+money(pg)+'  |  A pagar: '+money(tot-pg)+'</p>'}
  let dia=null;
  for(const t of L){
    if(t.data!==dia){if(dia)h+='</ul>';dia=t.data;h+='<h3 class="dia">'+nomeDia(dia)+'</h3><ul class="lista painel">'}
    h+=linhaTx(t);
  }
  return h+'</ul>';
}

function vOrc(){
  const mes=mesNome(S.ym),cats=S.config.categorias.filter(c=>c.tipo==='despesa');
  let h='<div class="vh"><h1>Orçamento</h1></div>';
  if(!cats.length)return h+'<section class="painel vazio"><h2>Monte seu orçamento</h2><p>Crie categorias de despesa e defina quanto quer gastar em cada uma por mês.</p><button class="btn" data-action="categorias">Criar categorias</button></section>';
  const g=gastoCat(S.ym),lim=S.config.orcamento;
  const com=cats.filter(c=>lim[c.id]>0),sem=cats.filter(c=>!(lim[c.id]>0));
  if(com.length){
    const L=com.reduce((s,c)=>s+lim[c.id],0),G=com.reduce((s,c)=>s+(g[c.id]||0),0),r=L-G;
    h+='<section class="orc-tot"><p class="hero-l">Despesas de '+mes+' nas categorias com limite</p><p class="orc-v"><strong>'+money(G)+'</strong> de '+money(L)+'</p>'+barra(G,L)+'<p class="orc-msg'+(r<0?' neg':'')+'">'+(r>=0?'Ainda dá para gastar '+money(r)+'.':'Passou '+money(-r)+' do orçamento.')+'</p></section>';
    com.sort((a,b)=>(g[b.id]||0)/lim[b.id]-(g[a.id]||0)/lim[a.id]);
    h+='<section class="bloco"><div class="bloco-h"><h2>Com limite</h2></div><ul class="lista painel">'+com.map(c=>linhaOrc(c,g[c.id]||0,lim[c.id])).join('')+'</ul></section>';
  }else h+='<p class="dica">Defina um limite mensal nas categorias abaixo para acompanhar quanto ainda pode gastar. O limite vale para todos os meses.</p>';
  if(sem.length)h+='<section class="bloco"><div class="bloco-h"><h2>Sem limite</h2></div><ul class="lista painel">'+sem.map(c=>'<li class="linha"><span class="linha-main estatico"><span class="dot" style="background:'+c.cor+'"></span><span class="txt"><span class="t1">'+esc(c.nome)+'</span><span class="t2">'+money(g[c.id]||0)+' em despesas em '+mes+'</span></span></span><button class="pill" data-action="limite" data-id="'+c.id+'">Definir limite</button></li>').join('')+'</ul></section>';
  if(g._sem)h+='<p class="dica topo">'+money(g._sem)+' em despesas sem categoria em '+mes+'.</p>';
  return h;
}

function aportesDe(id){const out=[];for(const ym in S.months)for(const t of S.months[ym])if(t.tipo==='aporte'&&t.metaId===id)out.push(t);return out.sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0))}
function linhaAporte(t){return '<li><button class="tx" data-action="edit-tx" data-id="'+t.id+'"><span class="txt"><span class="t1">'+(t.valor<0?'Retirou':'Guardou')+(t.desc?': '+esc(t.desc):'')+'</span><span class="t2">'+fmtData(t.data)+'</span></span><span class="val'+(t.valor<0?'':' v-aporte')+'">'+(t.valor<0?'− ':'+ ')+money(Math.abs(t.valor))+'</span></button></li>'}
function histMeta(id,max){
  const A=aportesDe(id);if(!A.length)return '';
  return '<div class="hist"><p class="hist-h">Histórico</p><ul class="lista">'+A.slice(0,max).map(linhaAporte).join('')+'</ul>'+(A.length>max?'<button class="link" data-action="hist-meta" data-id="'+id+'">Ver histórico completo ('+A.length+')</button>':'')+'</div>';
}
function orfaos(){
  const ids=new Set(S.config.metas.map(m=>m.id)),A=[];
  for(const ym in S.months)for(const t of S.months[ym])if(t.tipo==='aporte'&&!ids.has(t.metaId))A.push(t);
  if(!A.length)return '';
  A.sort((a,b)=>b.data.localeCompare(a.data));
  return '<section class="bloco"><div class="bloco-h"><h2>De metas excluídas</h2></div><ul class="lista painel">'+A.map(linhaAporte).join('')+'</ul></section>';
}
function modalHistMeta(id){
  const m=metaById(id);if(!m)return;
  openModal('<div class="form">'+cab('Histórico: '+esc(m.nome))+'<ul class="lista painel">'+aportesDe(id).map(linhaAporte).join('')+'</ul></div>');

function chkIndex(ym){
  const idx={};
  for(const m in S.months)for(const t of S.months[m])if(t.tipo==='despesa'&&t.catId){const ref=t.chk||t.ref||m;if(ref===ym)(idx[t.catId]=idx[t.catId]||[]).push({tx:t,ym:m})}
  return idx;
}
function vencInfo(c,ym){
  if(!c.dia)return null;
  const dR=Math.min(c.dia,diasNoMes(ym));
  if(ym!==ymHoje())return {txt:'vence dia '+dR,cls:'',diff:null};
  const diff=dR-Number(hoje().slice(8));
  if(diff<0)return {txt:'atrasada há '+(-diff)+(diff===-1?' dia':' dias'),cls:'atrasada',diff};
  if(diff===0)return {txt:'vence hoje',cls:'hoje',diff};
  if(diff===1)return {txt:'vence amanhã',cls:'breve',diff};
  if(diff<=3)return {txt:'vence em '+diff+' dias',cls:'breve',diff};
  return {txt:'vence dia '+dR,cls:'',diff};
}
function avisosMes(){
  const ym=ymHoje(),idx=chkIndex(ym),out=[];
  for(const c of S.config.categorias){
    if(c.tipo!=='despesa'||!c.dia)continue;
    const P=idx[c.id]||[];if(P.length&&P.every(p=>isPago(p.tx)))continue;
    const vi=vencInfo(c,ym);if(!vi||!vi.cls)continue;
    const pend=P.filter(p=>!isPago(p.tx)).reduce((a,p)=>a+p.tx.valor,0),pv=planoVal(ym,c.id);
    out.push({nome:c.nome,acao:'chk',id:c.id,vi,valor:pend||pv||0});
  }
  for(const ct of contasMes(ym)){
    if(ct.paga||['atrasada','hoje','breve'].indexOf(ct.status)<0)continue;
    const diff=ct.diaR-Number(hoje().slice(8));
    out.push({nome:ct.nome,acao:'pagar-conta',id:ct.id,vi:{txt:diff<0?'atrasada há '+(-diff)+(diff===-1?' dia':' dias'):diff===0?'vence hoje':diff===1?'vence amanhã':'vence em '+diff+' dias',cls:diff<0?'atrasada':diff===0?'hoje':'breve',diff},valor:ct.valor});
  }
  const hjD=hoje();
  for(const k of S.config.cartoes)for(const f of faturas(k.id)){
    if(f.paga)continue;
    const diff=Math.round((new Date(f.vence+'T12:00')-new Date(hjD+'T12:00'))/864e5);
    if(diff>3)continue;
    out.push({nome:'Fatura '+k.nome,acao:'fatura',id:k.id+'|'+f.V,vi:{txt:diff<0?'atrasada há '+(-diff)+(diff===-1?' dia':' dias'):diff===0?'vence hoje':diff===1?'vence amanhã':'vence em '+diff+' dias',cls:diff<0?'atrasada':diff===0?'hoje':'breve',diff},valor:f.total});
  }
  return out.sort((a,b)=>a.vi.diff-b.vi.diff);
}
function blocoAvisos(){
  if(S.ym!==ymHoje())return '';
  const A=avisosMes();if(!A.length)return '';
  return '<section class="bloco card-tech avisos"><div class="bloco-h"><h2>Avisos</h2><span class="dica">'+A.length+(A.length===1?' conta':' contas')+'</span></div><ul class="lista">'+A.slice(0,6).map(a=>
    '<li class="av-l"><span class="av-ic '+a.vi.cls+'">'+ic.sino+'</span><span class="txt"><span class="t1">'+esc(a.nome)+'</span><span class="t2"><span class="st-txt '+a.vi.cls+'">'+a.vi.txt+'</span>'+(a.valor?' · '+money(a.valor):'')+'</span></span><button class="pill" data-action="'+a.acao+'" data-id="'+a.id+'">Pagar</button></li>').join('')+
    '</ul></section>';
}
function vCheck(){
  const mes=mesNome(S.ym),cats=S.config.categorias.filter(c=>c.tipo==='despesa');
  let h='<div class="vh"><h1>Checklist</h1></div>';
  if(!cats.length)return h+'<section class="painel vazio"><h2>Monte seu checklist</h2><p>Cada categoria de despesa vira um item para você marcar quando pagar.</p><button class="btn" data-action="add-cat" data-t="despesa">'+ic.plus+' Adicionar categoria</button></section>';
  const idx=chkIndex(S.ym);let nPagas=0,totPago=0,totPend=0;
  const linhas=cats.map(c=>{
    const P=idx[c.id]||[],pagos=P.filter(p=>isPago(p.tx)),pend=P.filter(p=>!isPago(p.tx));
    const vPago=pagos.reduce((a,p)=>a+p.tx.valor,0),vPend=pend.reduce((a,p)=>a+p.tx.valor,0);
    totPago+=vPago;totPend+=vPend;
    const ok=P.length>0&&!pend.length;if(ok)nPagas++;
    let t2;
    if(ok){const ult=pagos.map(p=>p.tx.data).sort().pop();t2='Pago '+money(vPago)+' em '+fmtData(ult).slice(0,5)+(pagos.some(p=>p.tx.comp)?'<span class="clip" title="Com comprovante">'+ic.clip+'</span>':'')}
    else if(pend.length)t2='A pagar '+money(vPend)+(pagos.length?' ('+pagos.length+' de '+P.length+' pagas)':'');
    else t2='A pagar';
    if(!ok){const vi=vencInfo(c,S.ym);if(vi)t2+=' · <span class="st-txt '+vi.cls+'">'+vi.txt+'</span>'}
    return '<li><button class="chk-item'+(ok?' feito':'')+'" data-action="chk" data-id="'+c.id+'" aria-label="'+esc(c.nome)+', '+(ok?'pago':'a pagar')+'"><span class="chk-box" aria-hidden="true">'+(ok?ic.check:'')+'</span><span class="txt"><span class="t1">'+esc(c.nome)+'</span><span class="t2">'+t2+'</span></span><span class="dot" style="background:'+c.cor+'"></span></button></li>';
  }).join('');
  h+='<section class="chk-res"><p class="hero-l">Despesas pagas em '+mes+'</p><p class="orc-v"><strong>'+nPagas+' de '+cats.length+'</strong></p>'+barra(nPagas,cats.length,'b-chk')+'<p class="dica">Pago: '+money(totPago)+'  |  A pagar: '+money(totPend)+'</p></section>';
  return h+'<ul class="lista painel">'+linhas+'</ul><p class="dica topo">Toque numa despesa para marcar como paga e anexar o comprovante.</p>';
}

/* ---------- planejamento ---------- */
function planoVal(ym,catId){
  const m=S.config.plano[ym];
  if(m&&Object.prototype.hasOwnProperty.call(m,catId))return m[catId]==null?null:Number(m[catId]);
  const c=catById(catId),l=S.config.orcamento[catId];
  return c&&c.tipo==='despesa'&&l>0?l:null;
}
function realizado(ym){const r={};for(const t of lancs(ym))if((t.tipo==='receita'||t.tipo==='despesa')&&t.catId)r[t.catId]=(r[t.catId]||0)+t.valor;return r}
function resumoPlano(ym){
  let rec=0,desp=0,tem=false;
  for(const c of S.config.categorias){const v=planoVal(ym,c.id);if(v==null)continue;tem=true;if(c.tipo==='receita')rec+=v;else desp+=v}
  return {rec,desp,saldo:rec-desp,tem};
}
const mesesPlano=()=>{const a=ymHoje(),r=[];for(let i=0;i<12;i++)r.push(addM(a,i));return r};
const num2=v=>PRIV?'•••••':new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
const sinalMoney=v=>(v>0?'+ ':v<0?'− ':'')+money(Math.abs(v));
function linhaPlano(c,ym,real){
  const prev=planoVal(ym,c.id),lanc=real[c.id]||0,ehR=c.tipo==='receita';
  const dot='<span class="dot" style="background:'+c.cor+'"></span>';

/* ---------- ferramentas: base de cálculo ---------- */
function mesesComDados(n,incluirAtual){
  const out=[];let m=incluirAtual?ymHoje():addM(ymHoje(),-1);
  for(let i=0;i<36&&out.length<n;i++){const r=resumo(m);if(r.rec||r.desp)out.push(m);m=addM(m,-1)}
  return out;
}
function mediaMeses(M){
  if(!M.length)return {rec:0,desp:0,n:0};
  let rec=0,desp=0;for(const m of M){const r=resumo(m);rec+=r.rec;desp+=r.desp}
  return {rec:rec/M.length,desp:desp/M.length,n:M.length};
}
function basePadrao(){
  let M=mesesComDados(3,false),fonte='os últimos '+M.length+' meses fechados';
  if(!M.length){M=mesesComDados(1,true);fonte='o mês atual'}
  if(M.length===1&&M[0]!==ymHoje())fonte=mesNome(M[0])+' de '+M[0].slice(0,4);
  const md=mediaMeses(M);
  if(!md.desp){const d=disponivel(ymHoje());if(d.desp)return {rec:d.rec,desp:d.desp,M:[],fonte:'o seu Plano de '+mesNome(ymHoje())}}
  return {rec:md.rec,desp:md.desp,M,fonte};
}
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- análises do mês ---------- */
function analisar(ym){
  const out=[],ant=addM(ym,-1),real=realizado(ym),realA=realizado(ant),atual=ym===ymHoje(),dia=Number(hoje().slice(8));
  const r=resumo(ym),cats=S.config.categorias,temPlano=cats.some(c=>planoVal(ym,c.id)!=null);
  const fim=!atual||dia>=25;
  if(atual){const A=avisosMes().filter(a=>a.vi.cls==='atrasada');if(A.length)out.push({n:'alerta',i:ic.alerta,t:A.length+(A.length===1?' conta atrasada':' contas atrasadas'),x:A.map(a=>a.nome).join(', ')+'. Pague no Checklist pra não acumular juros.',p:100})}
  for(const c of cats){
    if(c.tipo!=='despesa')continue;
    const l=real[c.id]||0,pv=planoVal(ym,c.id),la=realA[c.id]||0;
    if(pv!=null&&pv>0&&l>pv*1.05&&l-pv>=20)out.push({n:'alerta',i:ic.alerta,t:c.nome+' passou do plano',x:'Lançado '+money(l)+' para '+money(pv)+' previstos ('+money(l-pv)+' a mais, +'+(pct(l,pv)-100)+'%).',p:90+Math.min(9,(l-pv)/100)});
    if(la>0&&l>la*1.2&&l-la>=50)out.push({n:'atencao',i:ic.sobe,t:c.nome+' subiu '+(pct(l,la)-100)+'%',x:money(l)+' em '+mesNome(ym)+' contra '+money(la)+' em '+mesNome(ant)+' ('+money(l-la)+' a mais).',p:70+Math.min(9,(l-la)/100)});
    if(fim&&la>0&&l<la*0.8&&la-l>=50)out.push({n:'positivo',i:ic.desce,t:c.nome+' caiu '+(100-pct(l,la))+'%',x:'Você gastou '+money(la-l)+' a menos que em '+mesNome(ant)+'.',p:40});
    if(temPlano&&l>0&&pv==null)out.push({n:'atencao',i:ic.luz,t:c.nome+' não estava no plano',x:money(l)+' lançados sem previsão. Coloque no Plano pra conta de "quanto posso gastar" ficar certa.',p:60});
  }
  if(fim)for(const c of cats){
    if(c.tipo!=='receita')continue;
    const l=real[c.id]||0,pv=planoVal(ym,c.id);
    if(pv&&l<pv*0.95)out.push({n:'atencao',i:ic.desce,t:c.nome+' abaixo do previsto',x:'Entrou '+money(l)+' de '+money(pv)+' previstos ('+money(pv-l)+' a menos).',p:65});
  }
  if(r.rec>0&&fim){
    const tx=(r.rec-r.desp-Math.max(0,r.apo))/r.rec;
    if(r.desp>r.rec)out.push({n:'alerta',i:ic.alerta,t:'Gastos maiores que a renda',x:'Saiu '+money(r.desp)+' e entrou '+money(r.rec)+'. Faltaram '+money(r.desp-r.rec)+'.',p:95});
    else if(tx>=0.2)out.push({n:'positivo',i:ic.escudo,t:'Você guardou '+Math.round(tx*100)+'% da renda',x:'Sobrou '+money(r.rec-r.desp-Math.max(0,r.apo))+' em '+mesNome(ym)+'. Ótimo ritmo.',p:45});
    else if(tx<0.05)out.push({n:'atencao',i:ic.pulso,t:'Sobrou pouco no mês',x:'Só '+Math.max(0,Math.round(tx*100))+'% da renda ficou livre. O ideal é pelo menos 10% a 20%.',p:75});
  }
  const L=lancs(ym),D=L.filter(t=>t.tipo==='despesa');
  const semCat=L.filter(t=>(t.tipo==='despesa'||t.tipo==='receita')&&!catById(t.catId)).length;
  if(semCat)out.push({n:'info',i:ic.tag,t:semCat+(semCat===1?' lançamento sem categoria':' lançamentos sem categoria'),x:'Classifique pra análises e gráficos ficarem certos. Use a Busca com o filtro "Sem categoria".',p:30});
  const semComp=D.filter(t=>isPago(t)&&t.valor>=100&&!t.comp&&!t.cartaoId).length;
  if(semComp)out.push({n:'info',i:ic.clip,t:semComp+(semComp===1?' pagamento sem comprovante':' pagamentos sem comprovante'),x:'Pagamentos acima de R$ 100. Anexe pelo Checklist pra ter tudo guardado.',p:25});
  if(D.length){
    const tot=D.reduce((a,t)=>a+t.valor,0),mx=D.reduce((a,t)=>t.valor>a.valor?t:a,D[0]),c=catById(mx.catId);
    out.push({n:'info',i:ic.pulso,t:'Maior despesa: '+(c?c.nome:(mx.desc||'Sem categoria')),x:money(mx.valor)+', '+pct(mx.valor,tot)+'% de tudo que saiu em '+mesNome(ym)+'.',p:20});
    const fixa=c2=>!!(c2&&(c2.dia||S.config.contas.some(ct=>ct.catId===c2.id)||(S.config.dividas||[]).some(d=>d.catId===c2.id)));
    const g={};for(const t of D){const cc=catById(t.catId);if(!cc||fixa(cc))continue;g[cc.id]=(g[cc.id]||0)+t.valor}
    const k=Object.keys(g).sort((a,b)=>g[b]-g[a])[0];
    if(k&&g[k]>=100)out.push({n:'info',i:ic.luz,t:'Onde dá pra economizar',x:'Cortando 10% de '+catById(k).nome+' você guarda '+money(g[k]*0.1)+' por mês, '+money(g[k]*1.2)+' em um ano.',p:35});
  }
  return out.sort((a,b)=>b.p-a.p);
}

/* ---------- nota de saúde financeira ---------- */
function notaSaude(){
  const b=basePadrao(),rec=b.rec,desp=b.desp,comps=[];
  const lin=(v,a,z)=>Math.max(0,Math.min(1,(v-a)/(z-a)));
  const sobra=rec?(rec-desp)/rec:0;
  comps.push({k:'Sobra no mês',max:30,pts:Math.round(30*lin(sobra,0,0.2)),txt:rec?'Sobra média de '+Math.round(sobra*100)+'% da renda (ideal: 20% ou mais).':'Sem receitas lançadas para calcular.',dica:'Tente deixar pelo menos 20% da renda livre todo mês.'});
  const fixas=S.config.categorias.filter(c=>c.tipo==='despesa'&&(c.dia||planoVal(ymHoje(),c.id)>0||S.config.contas.some(ct=>ct.catId===c.id)||(S.config.dividas||[]).some(d=>d.catId===c.id)));
  let fixo=0;
  if(fixas.length){for(const c of fixas){let s2=0;for(const m of (b.M.length?b.M:[ymHoje()]))s2+=Math.max(realizado(m)[c.id]||0,planoVal(m,c.id)||0);fixo+=s2/Math.max(1,b.M.length||1)}}
  else fixo=desp;
  const comp=rec?fixo/rec:1;
  comps.push({k:'Contas fixas e dívidas',max:25,pts:Math.round(25*(1-lin(comp,fixas.length?0.5:0.6,fixas.length?0.85:0.95))),txt:rec?(fixas.length?'Contas fixas':'Despesas')+' tomam '+Math.round(comp*100)+'% da renda.':'Sem receitas lançadas.',dica:fixas.length?'O ideal é que contas fixas fiquem abaixo de 50% da renda.':'Preencha o Plano ou o dia de vencimento das contas fixas pra essa parte ficar mais precisa.'});
  const res=reservaInfo();
  comps.push({k:'Reserva de emergência',max:20,pts:Math.round(20*lin(res.meses,0,6)),txt:res.custo?'Sua reserva cobre '+(Math.round(res.meses*10)/10).toString().replace('.',',')+' meses de gastos.':'Sem gastos lançados para calcular.',dica:'Monte uma reserva de 6 meses de gastos na ferramenta Reserva.'});
  const mc=mesesComDados(1,false)[0]||ymHoje(),idx=chkIndex(mc),dc=S.config.categorias.filter(c=>c.tipo==='despesa');
  let emDia=0,tot=0;
  for(const c of dc){const P=idx[c.id]||[];if(!P.length)continue;tot++;const ok=P.every(p=>isPago(p.tx)&&(!c.dia||p.tx.data<=mc+'-'+pad(Math.min(c.dia,diasNoMes(mc)))||p.tx.data.slice(0,7)<mc));if(ok)emDia++}
  comps.push({k:'Contas em dia',max:15,pts:tot?Math.round(15*emDia/tot):8,txt:tot?emDia+' de '+tot+' contas de '+mesNome(mc)+' pagas em dia.':'Ainda sem histórico do Checklist.',dica:'Coloque o dia de vencimento nas categorias pra receber avisos.'});
  const L3=[].concat(...(b.M.length?b.M:[ymHoje()]).map(lancs)).filter(t=>t.tipo==='despesa'||t.tipo==='receita');
  const comCat=L3.length?L3.filter(t=>catById(t.catId)).length/L3.length:1;
  const plano=S.config.categorias.some(c=>planoVal(ymHoje(),c.id)!=null);
  comps.push({k:'Organização',max:10,pts:Math.round(5*comCat)+(plano?5:0),txt:Math.round(comCat*100)+'% dos lançamentos com categoria'+(plano?' e Plano do mês preenchido.':'; Plano do mês ainda vazio.'),dica:'Preencha o Plano do mês e classifique todos os lançamentos.'});
  const nota=comps.reduce((a,c)=>a+c.pts,0);
  const faixa=nota>=85?'Excelente':nota>=70?'Boa':nota>=40?'Pode melhorar':'Atenção';
  return {nota,faixa,comps,fonte:b.fonte};
}
function arcoGauge(v){

function resultadosBusca(){
  const b=S.busca,toks=semAcento(b.q).split(/\s+/).filter(Boolean),mn=parseValor(b.min),mx=parseValor(b.max);
  const ini=b.per==='tudo'?'0000-00':b.per==='1'?S.ym:addM(ymHoje(),-(Number(b.per)-1)),fimP=b.per==='1'?S.ym:'9999-99';
  const R=[];
  for(const ym in S.months){
    if(ym<ini||ym>fimP)continue;
    for(const t of S.months[ym]){
      if(b.tipo!=='tudo'&&t.tipo!==b.tipo)continue;
      const c=catById(t.catId);
      if(b.cat==='_sem'?(t.tipo==='aporte'||c):b.cat&&t.catId!==b.cat)continue;
      if(b.sit==='pago'&&!(t.tipo==='despesa'&&isPago(t)))continue;
      if(b.sit==='apagar'&&!(t.tipo==='despesa'&&!isPago(t)))continue;
      if(b.sit==='comp'&&!t.comp)continue;
      if(b.sit==='semcomp'&&(t.comp||t.tipo!=='despesa'))continue;
      const v=Math.abs(t.valor);if(mn>0&&v<mn)continue;if(mx>0&&v>mx)continue;
      if(toks.length){
        const m=t.tipo==='aporte'?metaById(t.metaId):null;
        const kk=t.cartaoId?cartaoById(t.cartaoId):null;const alvo=semAcento([t.desc,c&&c.nome,m&&m.nome,t.pag,kk&&('cartao '+kk.nome),t.tipo,brl.format(v),String(v).replace('.',','),fmtData(t.data)].join(' '));
        if(!toks.every(k=>alvo.indexOf(k)>=0))continue;
      }
      R.push(t);
    }
  }
  if(!R.length)return '<section class="painel vazio"><p>Nada encontrado com esses filtros.</p></section>';
  R.sort((a,b2)=>b2.data.localeCompare(a.data)||(b2.criado||0)-(a.criado||0));
  const ent=R.filter(t=>t.tipo==='receita').reduce((a,t)=>a+t.valor,0),sai=R.filter(t=>t.tipo==='despesa').reduce((a,t)=>a+t.valor,0);
  let h='<div class="bs-res-h"><strong>'+R.length+(R.length===1?' resultado':' resultados')+'</strong><span class="dica">'+(sai?'Saiu '+money(sai):'')+(sai&&ent?' · ':'')+(ent?'Entrou '+money(ent):'')+'</span></div>';
  let mes=null;
  for(const t of R.slice(0,300)){
    const m=t.data.slice(0,7);
    if(m!==mes){if(mes)h+='</ul>';mes=m;h+='<h3 class="dia">'+cap(mesNome(m))+' de '+m.slice(0,4)+'</h3><ul class="lista painel">'}
    h+=linhaTx(t);
  }
  h+='</ul>';
  if(R.length>300)h+='<p class="dica topo">Mostrando os 300 mais recentes. Use os filtros pra achar o resto.</p>';
  return h;
}

const cartaoById=id=>S.config.cartoes.find(c=>c.id===id);
const dataDia=(ym,d)=>ym+'-'+pad(Math.min(d,diasNoMes(ym)));
function faturaKey(k,dataCompra,n){
  const [y,m,d]=dataCompra.split('-').map(Number);
  const ym=addM(y+'-'+pad(m),n-1),fYm=d<k.fecha?ym:addM(ym,1);

function infoFatura(k,V){

}
function comprasCartao(id){const L=[];for(const ym in S.months)for(const t of S.months[ym])if(t.cartaoId===id)L.push(t);return L}

const dividaById=id=>S.config.dividas.find(d=>d.id===id);
function pagoNoMes(catId,m){const P=chkIndex(m)[catId]||[];return P.length>0&&P.every(p=>isPago(p.tx))}
function estadoDivida(d){
  let pagas=d.pagasIni||0;const atual=ymHoje();
  if(d.catId){let m=d.desde;while(m<=atual){if(pagoNoMes(d.catId,m))pagas++;m=addM(m,1)}}
  else pagas+=Math.max(0,diffM(d.desde,atual));
  pagas=Math.min(pagas,d.total);
  const rest=d.total-pagas,pagoAtual=d.catId?pagoNoMes(d.catId,atual):false,prox=pagoAtual?addM(atual,1):atual;
  return {pagas,rest,falta:rest*d.parcela,fim:rest?addM(prox,rest-1):null,pago:pagas*d.parcela,prox};
}
function simularExtra(d,e,x){
  const PMT=d.parcela,i=(d.taxa||0)/100,PV=d.saldo||0;
  if(!x||x<=0)return null;
  if(i>0&&PV>0){
    const nOrig=e.rest,nNovo=-Math.log(1-i*PV/(PMT+x))/Math.log(1+i);
    if(!isFinite(nNovo))return null;
    const meses=Math.ceil(nNovo);return {meses,antes:Math.max(0,nOrig-meses),eco:Math.max(0,PMT*nOrig-(PMT+x)*nNovo),juros:true};
  }
  const meses=Math.ceil(e.falta/(PMT+x));return {meses,antes:Math.max(0,e.rest-meses),eco:0,juros:false};
}

  const m2=addM(ate,1);if(e.fim&&m2<=fim){let x=m2;while(x<=fim){if(S.config.plano[x])S.config.plano[x][d.catId]=null;x=addM(x,1)}}

/* ---------- fluxo de caixa diário ---------- */
function fluxoMes(ym){
  const atual=ymHoje(),sc=S.config.saldoConta;
  if(!sc||ym<atual)return null;
  let saldo,d0,corte;
  if(ym===atual){saldo=sc.valor;corte=sc.data<ym+'-01'?ym+'-00':sc.data;d0=corte.slice(0,7)===ym?Number(corte.slice(8)):0}
  else{const ant=fluxoMes(addM(ym,-1));if(!ant)return null;saldo=ant.fim;corte=ym+'-00';d0=0}
  const nD=diasNoMes(ym),ini=Math.max(1,d0+1),ev=[],dia=x=>Math.max(ini,Math.min(nD,x)),hj=Number(hoje().slice(8));
  const add=(d,v,t,sub)=>{if(Math.abs(v)<0.005)return;ev.push({d:dia(d),v,t,sub})};
  const L=lancs(ym),porCat={};
  for(const t of L){
    if(t.cartaoId)continue;
    if(t.catId)porCat[t.catId]=(porCat[t.catId]||0)+t.valor;
    const dd=Number(t.data.slice(8)),c=catById(t.catId),nome=t.desc||(c?c.nome:t.tipo==='aporte'?'Meta':'Sem categoria');
    if(t.tipo==='receita'){if(t.data>corte)add(dd,t.valor,nome,'Receita lançada')}
    else if(t.tipo==='despesa'){if(t.data>corte)add(dd,-t.valor,nome,isPago(t)?'Pago':'A pagar');else if(!isPago(t))add(ini,-t.valor,nome,t.data<corte?'A pagar (atrasada)':'A pagar')}
    else if(t.tipo==='aporte'){if(t.data>corte)add(dd,-t.valor,nome,'Guardado na meta')}
  }
  for(const t of L)if(t.cartaoId&&t.catId)porCat[t.catId]=(porCat[t.catId]||0)+t.valor;
  let semDia=0;
  for(const c of S.config.categorias){
    const pv=planoVal(ym,c.id);if(pv==null)continue;
    const ja=porCat[c.id]||0,falta=pv-ja;if(falta<=0.005||(ja>0&&falta<pv*0.05))continue;
    const d=c.dia?Math.min(c.dia,nD):nD;if(!c.dia)semDia++;
    if(c.tipo==='receita')add(d,falta,c.nome,'Previsto no Plano'+(c.dia?'':', sem dia'));
    else add(d,-falta,c.nome,'Previsto no Plano'+(c.dia?'':', sem dia'));
  }
  for(const k of S.config.cartoes)for(const f of faturas(k.id)){
    if(f.paga||f.V!==ym)continue;
    add(Number(f.vence.slice(8)),-f.total,'Fatura '+k.nome,ROT_FAT[f.st]);
  }
  for(const k of S.config.cartoes)for(const f of faturas(k.id))if(!f.paga&&f.V<ym&&ym===atual)add(ini,-f.total,'Fatura '+k.nome+' de '+mesNome(f.V),'Atrasada');
  ev.sort((a,b)=>a.d-b.d||b.v-a.v);
  const dias=[];let s=saldo,min=Infinity,minD=null,neg=null;
  for(let d=1;d<=nD;d++){
    const E=ev.filter(x=>x.d===d),ent=E.filter(x=>x.v>0).reduce((a,x)=>a+x.v,0),sai=E.filter(x=>x.v<0).reduce((a,x)=>a-x.v,0);
    if(d>=ini){s+=ent-sai;if(s<min){min=s;minD=d}if(s<0&&neg==null)neg=d}
    dias.push({d,E,ent,sai,saldo:d>=ini?s:null});
  }
  return {ym,ini:saldo,fim:s,dias,min,minD,neg,inicioDia:ini,semDia,corte,hj:ym===atual?hj:0};
}
function graficoFluxo(F){
  const D=F.dias.filter(x=>x.saldo!=null);if(D.length<2)return '';
  const W=640,H=180,pl=6,pr=6,pt=12,pb=22,vals=D.map(x=>x.saldo).concat([F.ini,0]),mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
  const X=d=>pl+(d-1)/(F.dias.length-1)*(W-pl-pr),Y=v=>pt+(mx-v)/rg*(H-pt-pb);
  const pts=D.map(x=>X(x.d).toFixed(1)+','+Y(x.saldo).toFixed(1)).join(' ');
  const area='M'+X(D[0].d).toFixed(1)+','+Y(Math.max(mn,0)).toFixed(1)+' L'+pts.replace(/ /g,' L')+' L'+X(D[D.length-1].d).toFixed(1)+','+Y(Math.max(mn,0)).toFixed(1)+' Z';
  const z=Y(0),neg=F.min<0;
  let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saldo previsto por dia: começa em '+money(F.ini)+', menor saldo '+money(F.min)+' no dia '+F.minD+', termina em '+money(F.fim)+'"><defs><linearGradient id="fxg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  g+='<path d="'+area+'" fill="url(#fxg)"/>';
  if(neg)g+='<rect x="'+pl+'" y="'+z.toFixed(1)+'" width="'+(W-pl-pr)+'" height="'+(H-pb-z).toFixed(1)+'" fill="var(--neg)" opacity=".08"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+z.toFixed(1)+'" y2="'+z.toFixed(1)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>';
  g+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  if(F.hj)g+='<line x1="'+X(F.hj).toFixed(1)+'" x2="'+X(F.hj).toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--accent-2)" stroke-width="1.5" opacity=".7"/>';
  if(F.minD)g+='<circle cx="'+X(F.minD).toFixed(1)+'" cy="'+Y(F.min).toFixed(1)+'" r="5" fill="'+(neg?'var(--neg)':'var(--accent)')+'" stroke="var(--surface)" stroke-width="2"/>';
  [1,10,20,F.dias.length].forEach(d=>{g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)" text-anchor="'+(d===1?'start':d===F.dias.length?'end':'middle')+'">'+d+'</text>'});
  return g+'</svg>';
}

/* ---------- simulador "posso comprar?" ---------- */
function sobraPrev(m,b){
  const d=disponivel(m);let rec=d.rec,desp=d.desp,est=false;
  if(!rec&&b.rec){rec=b.rec;est=true}
  if(!d.temPlano&&b.desp>desp){desp=b.desp;est=true}
  return {v:rec-desp-d.apo,rec,est};
}
function simular(o){
  const b=basePadrao(),cache={},sp=m=>cache[m]||(cache[m]=sobraPrev(m,b)),tot=o.valor,n=o.n,par=tot/n;
  const d0=disponivel(o.ym),semBase=!b.rec&&!b.desp&&!d0.rec&&!d0.desp;
  const calc=nn=>{const p=tot/nn;let pior=null,nivel='ok';for(let i=0;i<nn;i++){const m=addM(o.ym,i),x=sp(m),dep=x.v-p;if(!pior||dep<pior.depois)pior={m,i,antes:x.v,depois:dep};if(dep<0)nivel='nao';else if(nivel==='ok'&&dep<x.rec*0.1)nivel='aperta'}return {nivel,pior}};
  const r=calc(n),len=Math.min(12,Math.max(3,n+1)),M=[];let est=false;
  for(let i=0;i<len;i++){const m=addM(o.ym,i),x=sp(m),p=i<n?par:0;if(x.est)est=true;M.push({m,antes:x.v,depois:x.v-p,p})}
  let alt=null;
  if(r.nivel!=='ok'){
    for(let k=n+1;k<=24&&!alt;k++)if(calc(k).nivel==='ok')alt={k,nivel:'ok'};
    if(!alt&&r.nivel==='nao')for(let k=n+1;k<=24&&!alt;k++)if(calc(k).nivel==='aperta')alt={k,nivel:'aperta'};
  }
  const sob=[];for(let i=0;i<12;i++){const v=sp(addM(o.ym,i)).v;if(v>0)sob.push(v)}
  return {tot,n,par,nivel:r.nivel,pior:r.pior,M,alt,media:sob.length?sob.reduce((a,v)=>a+v,0)/sob.length:0,est,fonte:b.fonte,semBase};
}

let ultimaTela=null,tEntrada=null;
const semMovimento=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  chrome();
  const m=$('#main');
  if(!S.ready){m.innerHTML='<p class="carregando">Carregando suas finanças…</p>';return}
  const chave=S.view+'|'+(S.tool||'')+'|'+S.ym,nova=chave!==ultimaTela;ultimaTela=chave;
  m.innerHTML=(S.view==='inicio'?avisoBackup():'')+VIEWS[S.view]();
  ligarCalc(m);
  if(nova){
    m.classList.remove('entrada');void m.offsetWidth;m.classList.add('entrada');
    clearTimeout(tEntrada);tEntrada=setTimeout(()=>m.classList.remove('entrada'),1100);
    if(!semMovimento()&&!PRIV)$$('[data-n]',m).forEach(contar);
  }
}
function contar(el){
  const alvo=Number(el.dataset.n);if(!isFinite(alvo)||!alvo)return;
  const fmt=el.dataset.fmt==='sinal'?sinalMoney:money,t0=performance.now(),dur=750;
  const passo=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(alvo*e);if(k<1)requestAnimationFrame(passo);else el.textContent=fmt(alvo)};
  requestAnimationFrame(passo);
}

const cab=t=>'<div class="sheet-h"><h2>'+t+'</h2><button type="button" class="x" data-close aria-label="Fechar">'+ic.x+'</button></div>';
function ligarCalc(root){
  $$('.moeda',root).forEach(m=>{
    const inp=m.querySelector('input');if(!inp||m.querySelector('.calc-btn'))return;
    const b=document.createElement('button');b.type='button';b.className='calc-btn';b.setAttribute('aria-label','Abrir calculadora');b.title='Calculadora';b.innerHTML=ic.calc;
    b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();abrirCalc(inp)});
    m.appendChild(b);
  });
}
function openModal(html,mount){
  const root=$('#modal-root');
  root.innerHTML='<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-t">'+html+'</div></div>';
  root.hidden=false;document.body.classList.add('lock');
  const sheet=root.querySelector('.sheet');const h2=sheet.querySelector('h2');if(h2)h2.id='m-t';
  $$('[data-close]',sheet).forEach(b=>b.addEventListener('click',closeModal));
  ligarCalc(sheet);
  if(mount)mount(sheet);
  const first=sheet.querySelector('[data-foco]')||sheet.querySelector('input:not([type=radio]),select')||sheet.querySelector('button');
  if(first)first.focus({preventScroll:true});
}
